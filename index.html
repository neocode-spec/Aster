
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#131314">
<title>Aster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131314'/%3E%3Ctext x='32' y='49' text-anchor='middle' font-size='52' fill='%23c4b5fd'%3E%E2%9C%B3%3C/text%3E%3C/svg%3E">

<style>
:root {
  color-scheme:dark;
  --bg:#131314;
  --sidebar:#191a1b;
  --surface:#202122;
  --hover:#2b2c2e;
  --border:#393a3d;
  --text:#e3e3e3;
  --muted:#a1a1a8;
  --accent:#c4b5fd;
  --accent-soft:#302745;
}
* { box-sizing:border-box; }
html,body { width:100%;height:100%;margin:0; }
body {
  background:var(--bg);color:var(--text);
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  overflow:hidden;
}
button,textarea { font:inherit; }
button { color:inherit; }
button:focus-visible,textarea:focus-visible {
  outline:2px solid var(--accent);outline-offset:2px;
}
button:disabled { opacity:.55;cursor:wait; }
[hidden] { display:none!important; }

.app { display:flex;width:100%;height:100dvh; }

/* Compact, collapsible sidebar */
.sidebar {
  width:240px;min-width:240px;height:100%;
  padding:13px 10px;background:var(--sidebar);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .2s,min-width .2s;
  position:relative;z-index:30;
}
.sidebar.collapsed { width:68px;min-width:68px; }
.sidebar-top {
  height:46px;display:flex;align-items:center;
  gap:10px;padding:0 3px;margin-bottom:18px;
}
.icon-button {
  width:40px;height:40px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:50%;background:transparent;
  color:var(--muted);font-size:20px;cursor:pointer;
}
.icon-button:hover { background:var(--hover);color:var(--text); }
.brand-mark { color:var(--accent);font-size:27px; }
.new-chat {
  width:100%;min-height:42px;display:flex;
  align-items:center;gap:10px;padding:0 13px;
  border:0;border-radius:23px;background:#292a2c;
  cursor:pointer;text-align:left;white-space:nowrap;
}
.new-chat:hover { background:#343538; }
.new-chat-symbol { font-size:22px;line-height:1; }
.sidebar-label {
  padding:21px 12px 8px;font-size:12px;color:var(--muted);
}
.recent-list {
  flex:1;min-height:0;overflow-y:auto;
  scrollbar-width:thin;
}
.recent-item {
  width:100%;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
  text-align:left;padding:10px 12px;
  border:0;border-radius:12px;
  background:transparent;font-size:13px;cursor:pointer;
}
.recent-item:hover,.recent-item.active { background:var(--hover); }
.recent-empty { padding:12px;font-size:12px;color:#898990; }
.sidebar-bottom {
  display:flex;align-items:center;gap:8px;
  padding-top:10px;border-top:1px solid #353638;
}
.sidebar.collapsed .hide-collapsed { display:none; }
.sidebar.collapsed .sidebar-top { justify-content:center;padding:0; }
.sidebar.collapsed .new-chat { justify-content:center;padding:0; }
.sidebar.collapsed .sidebar-bottom { justify-content:center; }

/* Main area */
.main {
  flex:1;min-width:0;height:100%;
  display:flex;flex-direction:column;
}
.topbar {
  height:58px;min-height:58px;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
.topbar-left { display:flex;align-items:center;gap:10px; }
.model-name { font-size:16px;font-weight:550; }
.status {
  display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--muted);
}
.status-dot { width:7px;height:7px;border-radius:50%;background:#888; }
.status-dot.online { background:#81c995; }
.status-dot.busy { background:#e6c27a; }
.status-dot.error { background:#ff8a80; }
.mobile-menu { display:none!important; }

/* Scrollable conversation */
.conversation {
  flex:1;min-height:0;overflow-y:auto;
  scroll-behavior:smooth;
}
.welcome {
  width:min(760px,calc(100% - 40px));
  margin:0 auto;padding:clamp(40px,9vh,100px) 0 30px;
}
.greeting {
  margin:0 0 13px;
  font-size:clamp(34px,4.4vw,49px);
  line-height:1.15;letter-spacing:-1.6px;font-weight:500;
  background:linear-gradient(105deg,#c4b5fd,#e7dcff 45%,#d5d6e1);
  color:transparent;background-clip:text;-webkit-background-clip:text;
}
.subtitle {
  margin:0 0 29px;color:var(--muted);
  font-size:15px;line-height:1.6;
}
.suggestions {
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;margin-top:19px;
}
.suggestion {
  min-height:112px;padding:14px;
  display:flex;flex-direction:column;justify-content:space-between;
  gap:10px;text-align:left;border:1px solid transparent;
  border-radius:15px;background:var(--surface);
  cursor:pointer;transition:background .15s,border-color .15s;
}
.suggestion:hover { background:#28292a;border-color:#424346; }
.suggestion-text { font-size:13px;line-height:1.5; }
.suggestion-icon { align-self:flex-end;color:var(--accent);font-size:18px; }

/* Conversation messages */
.messages {
  width:min(760px,calc(100% - 40px));
  margin:0 auto;padding:24px 0 32px;
  display:flex;flex-direction:column;gap:25px;
}
.message { min-width:0;display:flex;flex-direction:column;gap:8px; }
.message.user { align-items:flex-end; }
.user-bubble {
  max-width:min(88%,600px);padding:12px 16px;
  background:#292a2c;border-radius:20px 20px 5px 20px;
  white-space:pre-wrap;overflow-wrap:anywhere;
  font-size:15px;line-height:1.65;
}
.message-role {
  display:flex;align-items:center;gap:8px;
  color:#b7b7bd;font-size:12px;font-weight:600;
}
.role-mark { color:var(--accent);font-size:17px; }
.message-body {
  min-width:0;font-size:15px;line-height:1.8;
  overflow-wrap:anywhere;
}
.message-body p { margin:0 0 13px; }
.message-body p:last-child { margin-bottom:0; }
.message-body h1,.message-body h2,.message-body h3 {
  line-height:1.35;margin:21px 0 9px;
}
.message-body h1 { font-size:25px; }
.message-body h2 { font-size:21px; }
.message-body h3 { font-size:17px; }
.message-body ul,.message-body ol { padding-left:24px;margin:8px 0 14px; }
.message-body li { margin:5px 0; }
.message-body blockquote {
  margin:13px 0;padding-left:13px;
  border-left:3px solid var(--accent);color:#c4c4cb;
}
.message-body pre {
  max-width:100%;overflow:auto;padding:14px;
  border:1px solid var(--border);border-radius:12px;
  background:#191a1b;
}
.message-body pre code { background:transparent;padding:0;white-space:pre; }
.message-body code {
  font-family:Consolas,monospace;font-size:.9em;
  background:#303033;padding:2px 5px;border-radius:5px;
}
.message-body a { color:#c4b5fd;text-decoration:underline; }
.message-body a:hover { color:#e4d7ff; }
.table-wrap {
  max-width:100%;overflow-x:auto;margin:14px 0;
  border:1px solid var(--border);border-radius:10px;
}
.message-body table { width:100%;border-collapse:collapse;font-size:13px; }
.message-body th,.message-body td {
  padding:9px 11px;text-align:left;vertical-align:top;
  border-bottom:1px solid var(--border);
}
.message-body th { background:#28272e;color:#e2d8ff; }
.message-body tr:last-child td { border-bottom:0; }
.message-actions {
  display:flex;align-items:center;gap:5px;
  flex-wrap:wrap;min-height:26px;
}
.small-action {
  padding:5px 8px;border:0;border-radius:8px;
  background:transparent;color:#9999a1;
  font-size:12px;cursor:pointer;
}
.small-action:hover { background:#292a2c;color:var(--text); }
.message-error { color:#ffb4ab; }
.sources {
  margin-top:15px;padding-top:11px;border-top:1px solid var(--border);
  font-size:12px;color:var(--muted);
}
.sources-title { margin-bottom:7px;font-weight:600; }
.sources a { display:inline-block;margin:3px 10px 3px 0; }
.typing { display:flex;gap:5px;padding:8px 0; }
.typing span {
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:pulse 1s infinite;
}
.typing span:nth-child(2) { animation-delay:.15s; }
.typing span:nth-child(3) { animation-delay:.3s; }
@keyframes pulse {
  0%,60%,100% { opacity:.3;transform:translateY(0); }
  30% { opacity:1;transform:translateY(-4px); }
}

/* Narrower centered composer */
.bottom-area {
  flex-shrink:0;padding:8px 20px 9px;background:var(--bg);
}
.bottom-inner { width:min(760px,100%);margin:0 auto; }
.composer-slot { width:100%; }
.composer {
  width:100%;padding:12px 14px 10px;
  border:1px solid #3a3b3d;border-radius:23px;
  background:#1e1f20;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.composer:focus-within {
  border-color:#b5a0ff;
  box-shadow:0 0 0 1px #b5a0ff33,0 0 20px #a78bfa12;
  background:#222124;
}
.composer textarea {
  display:block;width:100%;min-height:36px;max-height:170px;
  padding:4px 2px;resize:none;outline:none;border:0;
  background:transparent;color:var(--text);
  font-size:15px;line-height:1.55;
}
.composer textarea::placeholder { color:#a3a3aa; }
.composer-bottom {
  display:flex;align-items:center;justify-content:space-between;gap:7px;
}
.composer-options {
  display:flex;flex-wrap:wrap;align-items:center;gap:3px;min-width:0;
}
.dropdown-wrap { position:relative; }
.dropdown-button {
  min-height:34px;padding:0 9px;
  display:flex;align-items:center;gap:6px;
  border:1px solid transparent;border-radius:18px;
  background:transparent;color:#d8d8dc;
  font-size:12px;white-space:nowrap;cursor:pointer;
}
.dropdown-button:hover,.dropdown-button.active {
  background:#303133;border-color:#444548;
}
.dropdown-icon { color:var(--accent);font-size:15px; }
.chevron { color:var(--muted);font-size:10px; }
.dropdown-menu {
  display:none;position:absolute;bottom:calc(100% + 9px);left:0;
  width:235px;padding:7px;background:#252627;
  border:1px solid #414244;border-radius:15px;
  box-shadow:0 12px 35px #0008;z-index:50;
}
.dropdown-menu.open { display:block; }
.menu-heading {
  padding:8px 10px;font-size:10px;color:#a0a0a6;
  text-transform:uppercase;letter-spacing:.5px;
}
.menu-option {
  width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px;border:0;border-radius:10px;
  background:transparent;text-align:left;cursor:pointer;font-size:12px;
}
.menu-option:hover { background:#343537; }
.menu-option.selected { background:var(--accent-soft);color:#e3d9ff; }
.option-description {
  display:block;margin-top:3px;font-size:11px;
  line-height:1.4;color:#a3a3aa;
}
.option-check { color:var(--accent); }
.send-button {
  width:39px;height:39px;min-width:39px;
  display:flex;align-items:center;justify-content:center;
  border:0;border-radius:50%;background:#e4d7ff;color:#211a2c;
  font-size:25px;cursor:pointer;transition:background .15s,transform .15s;
}
.send-button:hover:not(:disabled) { background:#f1eaff;transform:scale(1.04); }
.send-button:disabled { background:#38383b;color:#85858c; }
.disclaimer {
  margin-top:8px;text-align:center;color:#85858b;
  font-size:10px;line-height:1.4;
}
.toast {
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  display:none;max-width:calc(100% - 30px);padding:11px 15px;
  border:1px solid #494a4d;border-radius:12px;
  background:#303133;box-shadow:0 5px 20px #0005;
  color:#eee;font-size:13px;z-index:100;
}
.toast.visible { display:block; }
.mobile-overlay { display:none; }

@media(max-width:760px) {
  .sidebar {
    position:fixed;inset:0 auto 0 0;height:100dvh;
    width:260px;min-width:260px;
    transform:translateX(-105%);
    box-shadow:none;transition:transform .2s;
  }
  .sidebar.mobile-open {
    transform:translateX(0);box-shadow:15px 0 50px #0007;
  }
  .sidebar.collapsed { width:260px;min-width:260px; }
  .sidebar.collapsed .hide-collapsed { display:initial; }
  .sidebar.collapsed .sidebar-top { justify-content:flex-start;padding:0 3px; }
  .sidebar.collapsed .new-chat { justify-content:flex-start;padding:0 13px; }
  .sidebar.collapsed .sidebar-bottom { justify-content:flex-start; }
  .mobile-overlay.visible {
    display:block;position:fixed;inset:0;background:#0008;z-index:29;
  }
  .topbar { height:54px;min-height:54px;padding:0 12px; }
  .mobile-menu { display:inline-flex!important; }
  .welcome { width:calc(100% - 30px);padding-top:40px; }
  .greeting { letter-spacing:-1px; }
  .subtitle { font-size:14px; }
  .suggestions { grid-template-columns:1fr;gap:8px; }
  .suggestion {
    min-height:67px;flex-direction:row;align-items:center;
    padding:12px 14px;
  }
  .suggestion-icon { flex-shrink:0; }
  .messages { width:calc(100% - 30px);padding-top:20px; }
  .bottom-area { padding:7px 10px 7px; }
  .composer { padding:10px 10px 8px;border-radius:20px; }
  .composer textarea { min-height:32px;font-size:14px; }
  .dropdown-button { padding:0 6px;gap:4px;font-size:11px; }
  .composer-options { gap:0; }
  .send-button { width:36px;height:36px;min-width:36px; }
  .message-body table { font-size:12px; }
  .message-body th,.message-body td { padding:7px; }
}
@media(max-width:390px) {
  .dropdown-button { font-size:10px;padding:0 4px; }
  .dropdown-icon { display:none; }
  .send-button { width:34px;height:34px;min-width:34px; }
  .composer-options { max-width:calc(100% - 40px); }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<div class="app">
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="icon-button" id="sidebarToggle" aria-label="Toggle sidebar" title="Toggle sidebar">☰</button>
      <span class="brand-mark" aria-label="Aster">✳</span>
    </div>

    <button class="new-chat" id="newChat">
      <span class="new-chat-symbol">＋</span>
      <span class="hide-collapsed">New chat</span>
    </button>

    <div class="sidebar-label hide-collapsed">Recent</div>
    <div class="recent-list hide-collapsed" id="recentList">
      <div class="recent-empty">Your recent chats will appear here.</div>
    </div>

    <div class="sidebar-bottom">
      <button class="icon-button" id="connectionButton" title="Check Dew connection" aria-label="Check Dew connection">◉</button>
      <span class="hide-collapsed" style="font-size:12px;color:#96969d">Dew connection</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <span class="model-name">Dew</span>
        <span class="chevron">▾</span>
      </div>
      <div class="status" aria-live="polite">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Checking connection</span>
      </div>
    </header>

    <section class="conversation" id="conversation">
      <div class="welcome" id="welcome">
        <h1 class="greeting" id="greeting">Where should we start?</h1>
        <p class="subtitle" id="subtitle">A little curiosity can lead somewhere interesting.</p>
        <div class="composer-slot" id="welcomeSlot"></div>

        <div class="suggestions" id="suggestions">
          <button class="suggestion" data-prompt="Explain a difficult concept in a simple, interesting way.">
            <span class="suggestion-text">Explain something complicated in simple terms</span>
            <span class="suggestion-icon">✧</span>
          </button>
          <button class="suggestion" data-prompt="Help me brainstorm an original idea for a project.">
            <span class="suggestion-text">Help me come up with an original idea</span>
            <span class="suggestion-icon">✳</span>
          </button>
          <button class="suggestion" data-prompt="Help me write clean, understandable code and explain how it works.">
            <span class="suggestion-text">Build something with code</span>
            <span class="suggestion-icon">⌘</span>
          </button>
        </div>
      </div>

      <div class="messages" id="messages" hidden></div>
    </section>

    <footer class="bottom-area">
      <div class="bottom-inner">
        <div class="composer-slot" id="bottomSlot"></div>
        <div class="disclaimer">Dew can make mistakes. Check important information.</div>
      </div>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<form class="composer" id="chatForm">
  <textarea id="messageInput" rows="1" maxlength="1200"
    placeholder="Ask Dew anything" aria-label="Message Dew" required></textarea>
  <div class="composer-bottom">
    <div class="composer-options">
      <div class="dropdown-wrap">
        <button type="button" class="dropdown-button" id="modeButton"
          aria-haspopup="true" aria-expanded="false">
          <span class="dropdown-icon">✳</span>
          <span id="modeLabel">Dew Standard</span><span class="chevron">▾</span>
        </button>
        <div class="dropdown-menu" id="modeMenu" role="menu">
          <div class="menu-heading">Choose Dew mode</div>
          <button type="button" class="menu-option selected" data-mode="Standard" role="menuitemradio" aria-checked="true">
            <span><strong>Dew Standard</strong><span class="option-description">Everyday work, writing and coding</span></span><span class="option-check">✓</span>
          </button>
          <button type="button" class="menu-option" data-mode="Extended" role="menuitemradio" aria-checked="false">
            <span><strong>Dew Extended</strong><span class="option-description">More involved tasks</span></span><span class="option-check"></span>
          </button>
          <button type="button" class="menu-option" data-mode="Search" role="menuitemradio" aria-checked="false">
            <span><strong>Dew Search</strong><span class="option-description">Web-oriented questions</span></span><span class="option-check"></span>
          </button>
        </div>
      </div>

      <div class="dropdown-wrap">
        <button type="button" class="dropdown-button" id="thinkingButton"
          aria-haspopup="true" aria-expanded="false">
          <span id="thinkingLabel">Medium</span><span class="chevron">▾</span>
        </button>
        <div class="dropdown-menu" id="thinkingMenu" role="menu">
          <div class="menu-heading">Thinking level</div>
          <button type="button" class="menu-option" data-thinking="Low" role="menuitemradio" aria-checked="false">
            <span><strong>Low</strong><span class="option-description">Faster responses</span></span><span class="option-check"></span>
          </button>
          <button type="button" class="menu-option selected" data-thinking="Medium" role="menuitemradio" aria-checked="true">
            <span><strong>Medium</strong><span class="option-description">Balanced reasoning</span></span><span class="option-check">✓</span>
          </button>
          <button type="button" class="menu-option" data-thinking="High" role="menuitemradio" aria-checked="false">
            <span><strong>High</strong><span class="option-description">More deliberate reasoning</span></span><span class="option-check"></span>
          </button>
        </div>
      </div>
    </div>
    <button type="submit" class="send-button" id="sendButton" aria-label="Send message" title="Send message">↑</button>
  </div>
</form>

<script>
"use strict";

/* Same-origin Vercel API. No Colab tunnel is needed. */
const DEW_API_URL = "/api/chat";
const DEW_HEALTH_URL = "/api/health";
const $ = id => document.getElementById(id);

const sidebar = $("sidebar");
const overlay = $("mobileOverlay");
const conversation = $("conversation");
const welcome = $("welcome");
const messages = $("messages");
const input = $("messageInput");
const composer = $("chatForm");
const sendButton = $("sendButton");

let selectedMode = "Standard";
let selectedReasoning = "Medium";
let isSending = false;
let currentChatId = null;
let chats = [];
let toastTimer;

const greetings = [
  ["Where should we start?", "A little curiosity can lead somewhere interesting."],
  ["What's on your mind?", "Bring a question, a challenge, or a new idea."],
  ["Let's explore something.", "From a quick question to a complicated problem."],
  ["Ready when you are.", "Think it through, build it, or figure it out."],
  ["What are we working on?", "Every interesting idea starts somewhere."]
];

function setGreeting() {
  const greeting = greetings[Math.floor(Math.random() * greetings.length)];
  $("greeting").textContent = greeting[0];
  $("subtitle").textContent = greeting[1];
}

function setStatus(state, text) {
  $("statusDot").className = "status-dot" + (state ? " " + state : "");
  $("statusText").textContent = text;
}

function showToast(text) {
  const toast = $("toast");
  toast.textContent = text;
  toast.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("visible"), 3500);
}

function moveComposerToBottom() {
  $("bottomSlot").appendChild(composer);
  $("suggestions").hidden = true;
}

function moveComposerToWelcome() {
  $("welcomeSlot").appendChild(composer);
  $("suggestions").hidden = false;
}

/* Dropdowns */
const dropdownPairs = [
  [$("modeButton"), $("modeMenu")],
  [$("thinkingButton"), $("thinkingMenu")]
];

function closeDropdowns() {
  dropdownPairs.forEach(([button, menu]) => {
    menu.classList.remove("open");
    button.classList.remove("active");
    button.setAttribute("aria-expanded", "false");
  });
}

function toggleDropdown(button, menu) {
  const opening = !menu.classList.contains("open");
  closeDropdowns();
  if (opening) {
    menu.classList.add("open");
    button.classList.add("active");
    button.setAttribute("aria-expanded", "true");
  }
}

$("modeButton").addEventListener("click", event => {
  event.stopPropagation();
  toggleDropdown($("modeButton"), $("modeMenu"));
});

$("thinkingButton").addEventListener("click", event => {
  event.stopPropagation();
  toggleDropdown($("thinkingButton"), $("thinkingMenu"));
});

document.addEventListener("click", event => {
  if (!event.target.closest(".dropdown-wrap")) closeDropdowns();
});

function refreshOptions(attribute, selected, labelId, prefix = "") {
  document.querySelectorAll("[" + attribute + "]").forEach(button => {
    const active = button.getAttribute(attribute) === selected;
    button.classList.toggle("selected", active);
    button.setAttribute("aria-checked", String(active));
    const check = button.querySelector(".option-check");
    if (check) check.textContent = active ? "✓" : "";
  });
  $(labelId).textContent = prefix + selected;
}

document.querySelectorAll("[data-mode]").forEach(button => {
  button.addEventListener("click", () => {
    selectedMode = button.dataset.mode;
    refreshOptions("data-mode", selectedMode, "modeLabel", "Dew ");
    closeDropdowns();
  });
});

document.querySelectorAll("[data-thinking]").forEach(button => {
  button.addEventListener("click", () => {
    selectedReasoning = button.dataset.thinking;
    refreshOptions("data-thinking", selectedReasoning, "thinkingLabel");
    closeDropdowns();
  });
});

/* Sidebar and mobile navigation */
function closeMobileSidebar() {
  sidebar.classList.remove("mobile-open");
  overlay.classList.remove("visible");
}

function updateMobileMenu() {
  if (innerWidth > 760) closeMobileSidebar();
}

$("sidebarToggle").addEventListener("click", () => {
  if (innerWidth <= 760) {
    sidebar.classList.toggle("mobile-open");
    overlay.classList.toggle("visible");
  } else {
    sidebar.classList.toggle("collapsed");
  }
});

$("mobileMenu").addEventListener("click", () => {
  sidebar.classList.add("mobile-open");
  overlay.classList.add("visible");
});

overlay.addEventListener("click", closeMobileSidebar);
window.addEventListener("resize", updateMobileMenu);

/* Safe Markdown renderer: escape text before creating formatting. */
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[char]);
}

function inlineMarkdown(value) {
  let text = escapeHTML(value);
  const codeParts = [];

  text = text.replace(/`([^`\n]+)`/g, (_, code) => {
    const token = "%%CODE" + codeParts.length + "%%";
    codeParts.push("<code>" + code + "</code>");
    return token;
  });

  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    (_, label, url) => {
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    });
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/__(.+?)__/g, "<strong>$1</strong>");
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  text = text.replace(/~~(.+?)~~/g, "<del>$1</del>");

  codeParts.forEach((code, index) => {
    text = text.replace("%%CODE" + index + "%%", code);
  });
  return text;
}

function splitTableRow(line) {
  let row = line.trim();
  if (row.startsWith("|")) row = row.slice(1);
  if (row.endsWith("|")) row = row.slice(0, -1);
  return row.split("|").map(cell => cell.trim());
}

function isTableDivider(line) {
  return splitTableRow(line).every(cell =>
    /^:?-{3,}:?$/.test(cell.replace(/\s/g, ""))
  );
}

function renderMarkdown(markdown) {
  const lines = String(markdown).replace(/\r\n?/g, "\n").split("\n");
  const output = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    if (/^\s*```/.test(line)) {
      i++;
      const code = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) {
        code.push(lines[i++]);
      }
      if (i < lines.length) i++;
      output.push("<pre><code>" + escapeHTML(code.join("\n")) + "</code></pre>");
      continue;
    }

    if (i + 1 < lines.length && line.includes("|") && isTableDivider(lines[i + 1])) {
      const headers = splitTableRow(line);
      i += 2;
      const rows = [];

      while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
        rows.push(splitTableRow(lines[i++]));
      }

      let table = '<div class="table-wrap"><table><thead><tr>';
      headers.forEach(cell => table += "<th>" + inlineMarkdown(cell) + "</th>");
      table += "</tr></thead><tbody>";

      rows.forEach(row => {
        table += "<tr>";
        headers.forEach((_, index) => {
          table += "<td>" + inlineMarkdown(row[index] || "") + "</td>";
        });
        table += "</tr>";
      });

      output.push(table + "</tbody></table></div>");
      continue;
    }

    const heading = line.match(/^\s*(#{1,3})\s+(.+)$/);
    if (heading) {
      const level = heading[1].length;
      output.push("<h" + level + ">" + inlineMarkdown(heading[2]) + "</h" + level + ">");
      i++;
      continue;
    }

    if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
      output.push("<hr>");
      i++;
      continue;
    }

    if (/^\s*>\s?/.test(line)) {
      const quote = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        quote.push(lines[i++].replace(/^\s*>\s?/, ""));
      }
      output.push("<blockquote>" + quote.map(inlineMarkdown).join("<br>") + "</blockquote>");
      continue;
    }

    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const tag = ordered ? "ol" : "ul";
      const pattern = ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/;
      const items = [];

      while (i < lines.length && pattern.test(lines[i])) {
        items.push("<li>" + inlineMarkdown(lines[i++].replace(pattern, "")) + "</li>");
      }
      output.push("<" + tag + ">" + items.join("") + "</" + tag + ">");
      continue;
    }

    const paragraph = [];
    while (
      i < lines.length &&
      lines[i].trim() &&
      !/^\s*```/.test(lines[i]) &&
      !/^\s*#{1,3}\s+/.test(lines[i]) &&
      !/^\s*(---+|\*\*\*+|___+)\s*$/.test(lines[i]) &&
      !/^\s*>\s?/.test(lines[i]) &&
      !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) &&
      !(i + 1 < lines.length && lines[i].includes("|") && isTableDivider(lines[i + 1]))
    ) {
      paragraph.push(lines[i++]);
    }
    output.push("<p>" + paragraph.map(inlineMarkdown).join("<br>") + "</p>");
  }

  return output.join("\n");
}

/* Chat history */
function getCurrentChat() {
  return chats.find(chat => chat.id === currentChatId) || null;
}

function refreshRecentList() {
  const list = $("recentList");
  list.replaceChildren();

  if (!chats.length) {
    const empty = document.createElement("div");
    empty.className = "recent-empty";
    empty.textContent = "Your recent chats will appear here.";
    list.appendChild(empty);
    return;
  }

  chats.forEach(chat => {
    const button = document.createElement("button");
    button.className = "recent-item" + (chat.id === currentChatId ? " active" : "");
    button.textContent = chat.title;
    button.title = chat.title;
    button.addEventListener("click", () => {
      currentChatId = chat.id;
      renderHistory(chat);
      refreshRecentList();
      closeMobileSidebar();
    });
    list.appendChild(button);
  });
}

function ensureChat() {
  let chat = getCurrentChat();
  if (chat) return chat;

  chat = {
    id: Date.now() + Math.floor(Math.random() * 100000),
    title: "New conversation",
    messages: []
  };
  chats.unshift(chat);
  currentChatId = chat.id;
  return chat;
}

function saveMessage(role, text) {
  const chat = ensureChat();
  chat.messages.push({ role, text });

  if (role === "user" && chat.messages.length === 1) {
    chat.title = text.replace(/\s+/g, " ").slice(0, 42) || "New conversation";
  }

  refreshRecentList();
  return chat.messages.length - 1;
}

function renderHistory(chat) {
  messages.replaceChildren();

  chat.messages.forEach((item, index) => {
    renderMessage(item.role, item.text, false, index);
  });

  welcome.hidden = true;
  messages.hidden = false;
  moveComposerToBottom();
  conversation.scrollTop = conversation.scrollHeight;
}

async function copyText(text, what = "Message") {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const temporary = document.createElement("textarea");
      temporary.value = text;
      temporary.style.position = "fixed";
      temporary.style.opacity = "0";
      document.body.appendChild(temporary);
      temporary.select();
      const copied = document.execCommand("copy");
      temporary.remove();
      if (!copied) throw new Error("Copy unavailable");
    }
    showToast(what + " copied.");
  } catch {
    showToast("Copy failed. Your browser blocked clipboard access.");
  }
}

function renderMessage(role, text, save = true, historyIndex = -1) {
  let index = historyIndex;
  if (save) index = saveMessage(role, text);

  const wrapper = document.createElement("article");
  wrapper.className = "message " + (role === "user" ? "user" : "assistant");

  if (role === "user") {
    const bubble = document.createElement("div");
    bubble.className = "user-bubble";
    bubble.textContent = text;
    wrapper.appendChild(bubble);
  } else {
    const label = document.createElement("div");
    label.className = "message-role";

    const mark = document.createElement("span");
    mark.className = "role-mark";
    mark.textContent = "✳";

    const name = document.createElement("span");
    name.textContent = "Dew";
    label.append(mark, name);

    const body = document.createElement("div");
    body.className = "message-body";
    body.innerHTML = renderMarkdown(text);
    wrapper.append(label, body);
  }

  const actions = document.createElement("div");
  actions.className = "message-actions";

  const copy = document.createElement("button");
  copy.type = "button";
  copy.className = "small-action";
  copy.textContent = "Copy";
  copy.addEventListener("click", () => copyText(text, role === "user" ? "Message" : "Response"));
  actions.appendChild(copy);

  if (role === "user") {
    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "small-action";
    edit.textContent = "Edit";
    edit.addEventListener("click", () => editMessage(index));
    actions.appendChild(edit);
  }

  wrapper.appendChild(actions);
  messages.appendChild(wrapper);
  conversation.scrollTop = conversation.scrollHeight;
  return wrapper;
}

/* Editing removes this message and all later messages before resubmission. */
function editMessage(index) {
  if (isSending) {
    showToast("Wait for Dew to finish before editing.");
    return;
  }

  const chat = getCurrentChat();
  if (!chat || !chat.messages[index] || chat.messages[index].role !== "user") return;

  const originalText = chat.messages[index].text;
  chat.messages.splice(index);
  renderHistory(chat);

  input.value = originalText;
  resizeInput();
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  showToast("Message ready to edit. Press Enter to resend.");
}

function addTyping() {
  const node = document.createElement("article");
  node.className = "message assistant";
  node.id = "typingIndicator";

  const label = document.createElement("div");
  label.className = "message-role";

  const mark = document.createElement("span");
  mark.className = "role-mark";
  mark.textContent = "✳";

  const name = document.createElement("span");
  name.textContent = "Dew is thinking";
  label.append(mark, name);

  const dots = document.createElement("div");
  dots.className = "typing";
  for (let i = 0; i < 3; i++) dots.appendChild(document.createElement("span"));

  node.append(label, dots);
  messages.appendChild(node);
  conversation.scrollTop = conversation.scrollHeight;
}

/* Vercel/Gemini API */
async function getDewReply(message) {
  let response;

  try {
    response = await fetch(DEW_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message,
        mode: "Dew " + selectedMode,
        thinking: selectedReasoning
      })
    });
  } catch (error) {
    console.error("Dew network error:", error);
    throw new Error("Aster could not reach its API. Check your Vercel deployment and try again.");
  }

  const raw = await response.text();
  let data;

  try {
    data = JSON.parse(raw);
  } catch {
    console.error("Non-JSON API response:", response.status, raw.slice(0, 500));
    if (response.status === 404) {
      throw new Error("The /api/chat endpoint was not found. Check that api/chat.js is deployed.");
    }
    throw new Error("The API returned an invalid response (HTTP " + response.status + ").");
  }

  if (!response.ok) {
    console.error("Dew API error:", response.status, data);
    const detail = data.error || data.detail || data.message;
    throw new Error(typeof detail === "string" ? detail : "API request failed (HTTP " + response.status + ").");
  }

  if (typeof data.answer !== "string") {
    console.error("Unexpected API response:", data);
    throw new Error("The API responded, but no answer was returned. Check api/chat.js.");
  }

  return {
    answer: data.answer,
    sources: Array.isArray(data.sources) ? data.sources : []
  };
}

function addSources(answer, sources) {
  if (!sources.length) return answer;

  const validSources = sources.filter(source =>
    source &&
    typeof source.title === "string" &&
    typeof source.url === "string" &&
    /^https?:\/\//i.test(source.url)
  );

  if (!validSources.length) return answer;

  const unique = [...new Map(validSources.map(source => [source.url, source])).values()];
  return answer + "\n\n**Sources**\n" + unique.map(source =>
    "- [" + source.title.replace(/[\[\]]/g, "") + "](" + source.url + ")"
  ).join("\n");
}

async function sendMessage(rawMessage) {
  const message = rawMessage.trim();
  if (!message || isSending) return;

  if (message.length > 1200) {
    showToast("Messages must be 1,200 characters or fewer.");
    return;
  }

  isSending = true;
  sendButton.disabled = true;
  input.disabled = true;
  closeDropdowns();

  welcome.hidden = true;
  messages.hidden = false;
  moveComposerToBottom();

  renderMessage("user", message);
  input.value = "";
  resizeInput();
  addTyping();
  setStatus("busy", "Dew is responding");

  try {
    const result = await getDewReply(message);
    $("typingIndicator")?.remove();

    const answerWithSources = addSources(result.answer, result.sources);
    renderMessage("assistant", answerWithSources);
    setStatus("online", "Connected");
  } catch (error) {
    $("typingIndicator")?.remove();
    console.error("Dew request failed:", error);

    const errorText = "I couldn't complete that request.\n\n" +
      (error instanceof Error ? error.message : "An unexpected error occurred.");

    const errorNode = renderMessage("assistant", errorText, false);
    errorNode.querySelector(".message-body")?.classList.add("message-error");
    setStatus("error", "Request failed");
  } finally {
    isSending = false;
    sendButton.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

composer.addEventListener("submit", event => {
  event.preventDefault();
  sendMessage(input.value);
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    if (!isSending) composer.requestSubmit();
  }
});

function resizeInput() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 170) + "px";
}

input.addEventListener("input", resizeInput);

/* Suggestion prompts */
document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click", () => {
    input.value = button.dataset.prompt;
    resizeInput();
    composer.requestSubmit();
  });
});

/* New chat */
$("newChat").addEventListener("click", () => {
  if (isSending) {
    showToast("Wait for Dew to finish before starting a new chat.");
    return;
  }

  currentChatId = null;
  messages.replaceChildren();
  messages.hidden = true;
  welcome.hidden = false;
  moveComposerToWelcome();
  input.value = "";
  resizeInput();
  setGreeting();
  closeDropdowns();
  closeMobileSidebar();
  refreshRecentList();
  conversation.scrollTop = 0;
  input.focus();
});

/* Check the deployed health endpoint, not Colab. */
async function checkConnection(showResult = false) {
  setStatus("", "Checking connection");
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);

  try {
    const response = await fetch(DEW_HEALTH_URL, {
      signal: controller.signal,
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Health endpoint returned HTTP " + response.status + ".");
    }

    const data = await response.json();
    if (data.status !== "ok") {
      throw new Error("Unexpected health-check response.");
    }

    setStatus("online", "API reachable");
    if (showResult) showToast("Aster API is reachable.");
  } catch (error) {
    console.warn("Aster health check failed:", error);
    setStatus("error", "API unavailable");

    if (showResult) {
      showToast(error.name === "AbortError"
        ? "Health check timed out. Check the Vercel deployment."
        : "Health check failed. Open /api/health to inspect the endpoint.");
    }
  } finally {
    clearTimeout(timeout);
  }
}

$("connectionButton").addEventListener("click", () => checkConnection(true));

/* Initial view */
moveComposerToWelcome();
setGreeting();
refreshOptions("data-mode", selectedMode, "modeLabel", "Dew ");
refreshOptions("data-thinking", selectedReasoning, "thinkingLabel");
refreshRecentList();
checkConnection();
</script>
