<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05060c">
  <title>Aster</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2305060c%22/><text x=%2216%22 y=%2225%22 text-anchor=%22middle%22 font-size=%2225%22 fill=%22%23c4b5fd%22>✳</text></svg>">

  <style>
    :root {
      color-scheme: dark;
      --bg: #05060c;
      --panel: #0b0d17;
      --surface: #111321;
      --border: #292c43;
      --text: #e7e6ef;
      --muted: #9293a8;
      --purple: #c4b5fd;
      --silver: #dedee9;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      background:
        radial-gradient(ellipse at 50% -20%, #25183b 0%, transparent 55%),
        radial-gradient(ellipse at 100% 100%, #101a30 0%, transparent 45%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; color: inherit; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 3px;
    }

    .app {
      display: flex;
      min-height: 100dvh;
      width: 100%;
    }

    .sidebar {
      width: 245px;
      flex: 0 0 245px;
      padding: 14px 10px;
      background: #080a12;
      border-right: 1px solid #1b1c2a;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      font-size: 18px;
    }

    .sparkle {
      color: var(--purple);
      font-size: 26px;
      text-shadow: 0 0 18px #a78bfa88;
    }

    .new-chat, .side-button {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      text-align: left;
      color: var(--muted);
    }

    .new-chat:hover, .side-button:hover {
      background: #171827;
      color: var(--text);
    }

    .side-label {
      margin: 12px 10px 4px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid #222335;
    }

    .main {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 100dvh;
      flex-direction: column;
    }

    .topbar {
      min-height: 65px;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #ffffff08;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-button {
      width: 39px;
      height: 39px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--silver);
    }

    .icon-button:hover {
      border-color: var(--purple);
      box-shadow: 0 0 18px #a78bfa22;
    }

    .mode-wrap { position: relative; }

    .mode-button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      color: var(--silver);
    }

    .mode-button:hover {
      border-color: #8e79c8;
    }

    .dropdown {
      position: absolute;
      z-index: 20;
      top: calc(100% + 8px);
      left: 0;
      width: 235px;
      padding: 7px;
      background: #111321;
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 16px 45px #000b;
    }

    .dropdown button {
      display: block;
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
    }

    .dropdown button:hover,
    .dropdown button.selected {
      background: #29213f;
      color: #e6dcff;
    }

    .dropdown small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #777;
    }

    .status-dot.online {
      background: #81c995;
      box-shadow: 0 0 8px #81c99588;
    }

    .status-dot.busy { background: #e6c27a; }
    .status-dot.error { background: #ff8a80; }

    .conversation {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 22px 12px;
    }

    .welcome {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }

    .greeting {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(29px, 4vw, 43px);
      font-weight: 500;
      letter-spacing: -1px;
      background: linear-gradient(100deg, #a78bfa, #f0eef9, #c4b5fd);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 20px #a78bfa30);
    }

    .subtitle {
      margin: 0 0 26px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .suggestions {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 620px;
    }

    .suggestion {
      padding: 16px;
      min-height: 82px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #10121fbb;
      color: var(--silver);
      text-align: left;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }

    .suggestion:hover {
      border-color: #9a83d7;
      box-shadow: 0 0 22px #a78bfa20;
      transform: translateY(-2px);
    }

    .suggestion small {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      line-height: 1.4;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 12px 0 32px;
    }

    .message {
      max-width: 100%;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .message.user {
      align-self: flex-end;
      max-width: 82%;
      padding: 13px 17px;
      border: 1px solid #8b78c533;
      border-radius: 19px 19px 5px 19px;
      background: #171526;
      white-space: pre-wrap;
    }

    .message.assistant {
      align-self: stretch;
      padding: 4px 0;
    }

    .message-role {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--silver);
      font-size: 12px;
    }

    .message-role .sparkle { font-size: 18px; }

    .message-content { white-space: pre-wrap; }

    .message-content a {
      color: var(--purple);
      overflow-wrap: anywhere;
    }

    .composer-area {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 12px 22px 22px;
    }

    .composer {
      position: relative;
      padding: 14px 14px 10px;
      border: 1px solid #77748c;
      border-radius: 25px;
      background: #0d0e19;
      box-shadow:
        0 0 0 1px #ffffff05,
        0 0 28px #a78bfa12;
      transition: border-color .2s, box-shadow .2s;
    }

    .composer:focus-within {
      border-color: #bdb2e7;
      box-shadow:
        0 0 0 1px #c4b5fd33,
        0 0 34px #a78bfa30;
    }

    .composer textarea {
      display: block;
      width: 100%;
      min-height: 48px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 5px 7px 12px;
      line-height: 1.6;
    }

    .composer textarea:focus-visible { outline: none; }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .composer-hint {
      color: var(--muted);
      font-size: 11px;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-toggle {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #151626;
      color: var(--silver);
      font-size: 19px;
    }

    .search-toggle.active {
      color: #fff;
      border-color: var(--purple);
      background: #34274d;
      box-shadow: 0 0 19px #a78bfa55;
    }

    .send-button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #ddd6fe, #9b8bd1);
      color: #11101a;
      font-size: 19px;
      font-weight: 700;
    }

    .send-button:hover { filter: brightness(1.1); }

    .footer-note {
      padding-top: 9px;
      color: #77788d;
      font-size: 10px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 100;
      bottom: 24px;
      left: 50%;
      max-width: calc(100% - 30px);
      transform: translateX(-50%) translateY(10px);
      opacity: 0;
      pointer-events: none;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #171827;
      color: var(--text);
      transition: opacity .2s, transform .2s;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Authentication */

    .auth-screen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: #0b0d17ed;
      box-shadow: 0 20px 80px #0008, 0 0 35px #a78bfa0b;
    }

    .auth-logo {
      text-align: center;
      font-size: 37px;
      color: var(--purple);
      text-shadow: 0 0 22px #a78bfa66;
    }

    .auth-title {
      margin: 8px 0;
      text-align: center;
      font-size: 25px;
      font-weight: 500;
    }

    .auth-description {
      margin: 0 0 24px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 4px;
      margin-bottom: 20px;
      border-radius: 12px;
      background: #151624;
    }

    .auth-tab {
      padding: 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
    }

    .auth-tab.active {
      background: #29213f;
      color: var(--silver);
    }

    .auth-label {
      display: block;
      margin: 13px 0 7px;
      color: #c7c5d4;
      font-size: 12px;
    }

    .auth-input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #080a12;
      color: var(--text);
    }

    .auth-input:focus {
      border-color: var(--purple);
      outline: none;
    }

    .auth-primary, .google-button {
      width: 100%;
      min-height: 45px;
      margin-top: 16px;
      border-radius: 12px;
      font-weight: 600;
    }

    .auth-primary {
      border: 0;
      background: linear-gradient(110deg, #ddd6fe, #a99adf);
      color: #12101b;
    }

    .google-button {
      border: 1px solid var(--border);
      background: #141521;
      color: var(--silver);
    }

    .google-button:hover { border-color: #9d8bd8; }

    .forgot-button {
      display: block;
      margin: 13px auto 0;
      border: 0;
      background: transparent;
      color: var(--purple);
      font-size: 12px;
    }

    .auth-status {
      min-height: 20px;
      margin: 12px 0 0;
      color: #ffaaa5;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .auth-status.success { color: #a5d6a7; }

    .account-button {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .sidebar { display: none; }
      .topbar { padding: 10px 12px; }
      .topbar-right .status { display: none; }
      .mode-button { padding: 9px 10px; font-size: 12px; }
      .conversation { padding: 14px 15px; }
      .composer-area { padding: 8px 12px 14px; }
      .suggestions { grid-template-columns: 1fr; }
      .welcome { min-height: 48vh; }
      .message.user { max-width: 92%; }
      .auth-card { padding: 24px 20px; }
    }
  </style>
</head>

<body>
  <!-- Authentication screen -->
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">✳</div>
      <h1 class="auth-title" id="authHeading">Welcome to Aster</h1>
      <p class="auth-description">
        Your personal AI workspace, powered by Dew.
      </p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="loginTab">
          Log in
        </button>
        <button type="button" class="auth-tab" id="signupTab">
          Create account
        </button>
      </div>

      <form id="authForm">
        <label class="auth-label" for="authName" id="nameLabel" hidden>
          Your name
        </label>
        <input
          class="auth-input"
          id="authName"
          type="text"
          autocomplete="name"
          placeholder="Your name"
          hidden
        >

        <label class="auth-label" for="authEmail">Email address</label>
        <input
          class="auth-input"
          id="authEmail"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >

        <label class="auth-label" for="authPassword">Password</label>
        <input
          class="auth-input"
          id="authPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          minlength="6"
          required
        >

        <button class="auth-primary" id="authSubmit" type="submit">
          Log in
        </button>
      </form>

      <button type="button" class="forgot-button" id="forgotButton">
        Forgot your password?
      </button>

      <button type="button" class="google-button" id="googleButton">
        Continue with Google
      </button>

      <p id="authStatus" class="auth-status" role="status"></p>
    </div>
  </section>

  <!-- Main Aster app -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="sparkle">✳</span>
        <span>Aster</span>
      </div>

      <button type="button" class="new-chat" id="newChatButton">
        ＋ New chat
      </button>

      <div class="side-label">Workspace</div>
      <button type="button" class="side-button" id="chatTabButton">
        ◇ Chat
      </button>
      <button type="button" class="side-button" id="codeTabButton">
        &lt;/&gt; Code
      </button>

      <div class="sidebar-bottom">
        <div class="side-label">Account</div>
        <button type="button" class="side-button" id="accountButton">
          Signed in
        </button>
        <button type="button" class="side-button" id="signOutButton">
          ↪ Sign out
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="sparkle">✳</span>

          <div class="mode-wrap">
            <button
              type="button"
              class="mode-button"
              id="modeButton"
              aria-expanded="false"
            >
              Dew Standard ▾
            </button>

            <div class="dropdown" id="modeDropdown" hidden>
              <button type="button" data-mode="Standard">
                Dew Standard
                <small>Everyday tasks, writing and coding</small>
              </button>
              <button type="button" data-mode="Search">
                Dew Search
                <small>Search the web for current information</small>
              </button>
              <button type="button" data-mode="Extended">
                Dew Extended
                <small>Extra reasoning for complex tasks</small>
              </button>
            </div>
          </div>

          <div class="mode-wrap">
            <button
              type="button"
              class="mode-button"
              id="reasoningButton"
              aria-expanded="false"
            >
              Medium ▾
            </button>

            <div class="dropdown" id="reasoningDropdown" hidden>
              <button type="button" data-reasoning="Low">Low</button>
              <button type="button" data-reasoning="Medium">Medium</button>
              <button type="button" data-reasoning="High">High</button>
            </div>
          </div>
        </div>

        <div class="topbar-right">
          <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Connecting</span>
          </div>
        </div>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <h1 class="greeting" id="greeting">Let's build something.</h1>
          <p class="subtitle" id="subtitle">
            Your next breakthrough can start with one question.
          </p>

          <div class="suggestions">
            <button
              type="button"
              class="suggestion"
              data-prompt="Help me plan and build a website from scratch."
            >
              Build something
              <small>Turn an idea into a working website.</small>
            </button>

            <button
              type="button"
              class="suggestion"
              data-prompt="Explain a difficult concept to me clearly, step by step."
            >
              Learn something
              <small>Make a complicated topic easier to understand.</small>
            </button>

            <button
              type="button"
              class="suggestion"
              data-prompt="Help me debug some code. Explain the cause and give me the corrected code."
            >
              Fix some code
              <small>Debug errors and improve your implementation.</small>
            </button>

            <button
              type="button"
              class="suggestion"
              data-prompt="Research the latest developments in AI and include sources."
            >
              Research a topic
              <small>Find useful information and reliable sources.</small>
            </button>
          </div>
        </div>

        <div id="messages" class="messages" aria-live="polite" hidden></div>
      </section>

      <section class="composer-area">
        <form id="chatForm" class="composer">
          <textarea
            id="messageInput"
            rows="1"
            maxlength="12000"
            placeholder="Ask Dew anything"
            aria-label="Message Dew"
            required
          ></textarea>

          <div class="composer-bottom">
            <span class="composer-hint" id="composerHint">
              Dew Standard · Medium
            </span>

            <div class="composer-actions">
              <button
                type="button"
                class="search-toggle"
                id="searchToggle"
                title="Switch to Dew Search"
                aria-label="Toggle Dew Search"
                aria-pressed="false"
              >✳</button>

              <button
                type="submit"
                class="send-button"
                id="sendButton"
                aria-label="Send message"
              >↑</button>
            </div>
          </div>
        </form>

        <div class="footer-note">
          Dew can make mistakes. Check important information.
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module">
    import { auth, googleProvider } from "/firebase.js";

    import {
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      sendPasswordResetEmail,
      signInWithPopup,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const $ = id => document.getElementById(id);

    let authMode = "login";
    let selectedMode = "Standard";
    let selectedReasoning = "Medium";
    let selectedTab = "Chat";
    let sending = false;
    let currentChatId = createChatId();
    let toastTimeout;

    function createChatId() {
      if (globalThis.crypto?.randomUUID) {
        return globalThis.crypto.randomUUID().replace(/-/g, "");
      }

      return "chat_" + Date.now() + "_" +
        Math.random().toString(36).slice(2, 12);
    }

    function setAuthStatus(message, success = false) {
      const node = $("authStatus");
      node.textContent = message;
      node.classList.toggle("success", success);
    }

    function setAuthBusy(busy) {
      $("authSubmit").disabled = busy;
      $("googleButton").disabled = busy;
      $("forgotButton").disabled = busy;
      $("authSubmit").textContent = busy
        ? "Please wait…"
        : authMode === "login"
          ? "Log in"
          : "Create account";
    }

    function setAuthMode(mode) {
      authMode = mode;
      const isSignup = mode === "signup";

      $("loginTab").classList.toggle("active", !isSignup);
      $("signupTab").classList.toggle("active", isSignup);
      $("authHeading").textContent = isSignup
        ? "Create your account"
        : "Welcome to Aster";

      $("nameLabel").hidden = !isSignup;
      $("authName").hidden = !isSignup;
      $("authName").required = isSignup;
      $("authPassword").autocomplete = isSignup
        ? "new-password"
        : "current-password";

      $("forgotButton").hidden = isSignup;
      $("authSubmit").textContent = isSignup
        ? "Create account"
        : "Log in";

      setAuthStatus("");
    }

    function friendlyAuthError(error) {
      const code = error?.code || "";

      const messages = {
        "auth/invalid-email": "Enter a valid email address.",
        "auth/user-not-found": "No account was found for that email.",
        "auth/wrong-password": "The email or password is incorrect.",
        "auth/invalid-credential": "The email or password is incorrect.",
        "auth/email-already-in-use": "An account already exists for this email.",
        "auth/weak-password": "Use a stronger password with at least 6 characters.",
        "auth/popup-closed-by-user": "The Google sign-in window was closed.",
        "auth/popup-blocked": "Your browser blocked the Google sign-in window.",
        "auth/operation-not-allowed": "This sign-in method is disabled in Firebase Authentication.",
        "auth/network-request-failed": "Network error. Check your internet connection.",
        "auth/too-many-requests": "Too many attempts. Wait a while and try again."
      };

      return messages[code] ||
        error?.message ||
        "Authentication failed. Please try again.";
    }

    $("loginTab").addEventListener("click", () => setAuthMode("login"));
    $("signupTab").addEventListener("click", () => setAuthMode("signup"));

    $("authForm").addEventListener("submit", async event => {
      event.preventDefault();

      const email = $("authEmail").value.trim();
      const password = $("authPassword").value;
      const name = $("authName").value.trim();

      setAuthBusy(true);
      setAuthStatus("");

      try {
        if (authMode === "signup") {
          if (!name) {
            throw new Error("Enter your name to create an account.");
          }

          const result = await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          await updateProfile(result.user, {
            displayName: name
          });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        console.error("Aster email authentication error:", error);
        setAuthStatus(friendlyAuthError(error));
      } finally {
        setAuthBusy(false);
      }
    });

    $("googleButton").addEventListener("click", async () => {
      setAuthBusy(true);
      setAuthStatus("");

      try {
        await signInWithPopup(auth, googleProvider);
      } catch (error) {
        console.error("Aster Google authentication error:", error);
        setAuthStatus(friendlyAuthError(error));
      } finally {
        setAuthBusy(false);
      }
    });

    $("forgotButton").addEventListener("click", async () => {
      const email = $("authEmail").value.trim();

      if (!email) {
        setAuthStatus("Enter your email address first.");
        $("authEmail").focus();
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        setAuthStatus(
          "If an account exists for that email, a reset email has been sent.",
          true
        );
      } catch (error) {
        console.error("Aster password reset error:", error);
        setAuthStatus(friendlyAuthError(error));
      }
    });

    function toast(message) {
      const node = $("toast");
      node.textContent = message;
      node.classList.add("visible");

      clearTimeout(toastTimeout);

      toastTimeout = setTimeout(() => {
        node.classList.remove("visible");
      }, 3500);
    }

    function setStatus(state, message) {
      $("statusDot").className = "status-dot" +
        (state ? " " + state : "");
      $("statusText").textContent = message;
    }

    function randomGreeting() {
      const hour = new Date().getHours();

      const greetings = hour < 12
        ? [
            "Good morning.",
            "A fresh morning, a fresh start.",
            "Morning. Ready when you are."
          ]
        : hour < 17
          ? [
              "Good afternoon.",
              "Midday momentum.",
              "Let's make the afternoon count."
            ]
          : hour < 21
            ? [
                "Good evening.",
                "Evening. Time to build.",
                "A quiet evening for big ideas."
              ]
            : [
                "Night mode: on.",
                "The stars are out. So are you.",
                "Up with the moon?"
              ];

      $("greeting").textContent =
        greetings[Math.floor(Math.random() * greetings.length)];

      const subtitles = [
        "Your next breakthrough can start with one question.",
        "Start simple. Refine as you go.",
        "Bring the rough idea. We can work on the details.",
        "Clear thinking starts with a good question."
      ];

      $("subtitle").textContent =
        subtitles[Math.floor(Math.random() * subtitles.length)];
    }

    function updateModeUI() {
      $("modeButton").textContent = "Dew " + selectedMode + " ▾";
      $("reasoningButton").textContent = selectedReasoning + " ▾";
      $("composerHint").textContent =
        "Dew " + selectedMode + " · " + selectedReasoning;

      document.querySelectorAll("[data-mode]").forEach(button => {
        button.classList.toggle(
          "selected",
          button.dataset.mode === selectedMode
        );
      });

      document.querySelectorAll("[data-reasoning]").forEach(button => {
        button.classList.toggle(
          "selected",
          button.dataset.reasoning === selectedReasoning
        );
      });

      $("searchToggle").classList.toggle(
        "active",
        selectedMode === "Search"
      );

      $("searchToggle").setAttribute(
        "aria-pressed",
        String(selectedMode === "Search")
      );
    }

    function toggleDropdown(which) {
      const mode = $("modeDropdown");
      const reasoning = $("reasoningDropdown");

      if (which === "mode") {
        mode.hidden = !mode.hidden;
        reasoning.hidden = true;
        $("modeButton").setAttribute(
          "aria-expanded",
          String(!mode.hidden)
        );
        $("reasoningButton").setAttribute("aria-expanded", "false");
      } else {
        reasoning.hidden = !reasoning.hidden;
        mode.hidden = true;
        $("reasoningButton").setAttribute(
          "aria-expanded",
          String(!reasoning.hidden)
        );
        $("modeButton").setAttribute("aria-expanded", "false");
      }
    }

    $("modeButton").addEventListener("click", () => {
      toggleDropdown("mode");
    });

    $("reasoningButton").addEventListener("click", () => {
      toggleDropdown("reasoning");
    });

    document.querySelectorAll("[data-mode]").forEach(button => {
      button.addEventListener("click", () => {
        selectedMode = button.dataset.mode;
        $("modeDropdown").hidden = true;
        updateModeUI();
      });
    });

    document.querySelectorAll("[data-reasoning]").forEach(button => {
      button.addEventListener("click", () => {
        selectedReasoning = button.dataset.reasoning;
        $("reasoningDropdown").hidden = true;
        updateModeUI();
      });
    });

    $("searchToggle").addEventListener("click", () => {
      selectedMode = selectedMode === "Search" ? "Standard" : "Search";
      updateModeUI();

      if (selectedMode === "Search") {
        toast("Dew Search is active.");
      } else {
        toast("Dew Standard is active.");
      }
    });

    $("chatTabButton").addEventListener("click", () => {
      selectedTab = "Chat";
      $("messageInput").placeholder = "Ask Dew anything";
      toast("Chat mode selected.");
    });

    $("codeTabButton").addEventListener("click", () => {
      selectedTab = "Code";
      $("messageInput").placeholder = "Describe the code you want to build";
      toast("Code mode selected.");
      $("messageInput").focus();
    });

    function scrollToBottom() {
      $("conversation").scrollTop =
        $("conversation").scrollHeight;
    }

    function addMessage(role, text, sources = []) {
      const container = $("messages");
      container.hidden = false;

      const node = document.createElement("article");
      node.className = "message " + role;

      if (role === "assistant") {
        const header = document.createElement("div");
        header.className = "message-role";

        const logo = document.createElement("span");
        logo.className = "sparkle";
        logo.textContent = "✳";

        const label = document.createElement("span");
        label.textContent = "Dew";

        header.append(logo, label);

        const content = document.createElement("div");
        content.className = "message-content";
        content.textContent = text;

        node.append(header, content);

        const validSources = Array.isArray(sources)
          ? sources.filter(source =>
              source &&
              typeof source.title === "string" &&
              typeof source.url === "string" &&
              /^https?:\/\//i.test(source.url)
            )
          : [];

        if (validSources.length) {
          const sourceHeading = document.createElement("p");
          sourceHeading.textContent = "Sources";
          sourceHeading.style.fontWeight = "600";
          sourceHeading.style.fontSize = "12px";
          node.append(sourceHeading);

          const list = document.createElement("ul");

          for (const source of validSources) {
            const item = document.createElement("li");
            const link = document.createElement("a");

            link.href = source.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = source.title;

            item.append(link);
            list.append(item);
          }

          node.append(list);
        }
      } else {
        node.textContent = text;
      }

      container.append(node);
      $("welcome").hidden = true;
      scrollToBottom();

      return node;
    }

    function showTyping() {
      const node = document.createElement("article");
      node.className = "message assistant";
      node.id = "typingIndicator";

      const header = document.createElement("div");
      header.className = "message-role";
      header.textContent = "✳ Dew is thinking…";

      node.append(header);
      $("messages").append(node);
      $("messages").hidden = false;
      $("welcome").hidden = true;
      scrollToBottom();
    }

    function removeTyping() {
      $("typingIndicator")?.remove();
    }

    async function getDewReply(message) {
      const user = auth.currentUser;

      if (!user) {
        throw new Error("Your session has expired. Please log in again.");
      }

      const token = await user.getIdToken();

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          message,
          mode: "Dew " + selectedMode,
          thinking: selectedReasoning,
          tab: selectedTab,
          conversationId: String(currentChatId || "main")
        })
      });

      const raw = await response.text();
      let data;

      try {
        data = JSON.parse(raw);
      } catch {
        console.error(
          "Aster API returned a non-JSON response:",
          response.status,
          raw.slice(0, 500)
        );

        if (response.status === 404) {
          throw new Error(
            "The /api/chat endpoint was not found. Check the file location in your GitHub repository."
          );
        }

        throw new Error(
          "The API returned an invalid response (HTTP " +
          response.status +
          ")."
        );
      }

      if (!response.ok) {
        console.error("Aster API error:", response.status, data);

        const detail = [
          data.error || "REQUEST_FAILED",
          data.detail
        ].filter(Boolean).join(": ");

        throw new Error(detail);
      }

      if (
        typeof data.answer !== "string" ||
        !data.answer.trim()
      ) {
        throw new Error("Dew returned an empty response.");
      }

      return {
        answer: data.answer,
        sources: Array.isArray(data.sources) ? data.sources : []
      };
    }

    async function sendMessage(text) {
      const message = text.trim();

      if (!message || sending) return;

      if (!auth.currentUser) {
        toast("Log in before sending a message.");
        return;
      }

      sending = true;
      $("sendButton").disabled = true;
      setStatus("busy", "Dew is thinking");

      addMessage("user", message);
      $("messageInput").value = "";
      resizeInput();
      showTyping();

      try {
        const result = await getDewReply(message);

        removeTyping();
        addMessage("assistant", result.answer, result.sources);
        setStatus("online", "Connected");
      } catch (error) {
        removeTyping();

        console.error("Aster chat error:", error);

        addMessage(
          "assistant",
          "I couldn't complete that request.\n\n" +
          (error?.message || "An unexpected error occurred.") +
          "\n\nCheck the Vercel Function logs if this keeps happening."
        );

        setStatus("error", "Request failed");
      } finally {
        sending = false;
        $("sendButton").disabled = false;
        $("messageInput").focus();
      }
    }

    $("chatForm").addEventListener("submit", async event => {
      event.preventDefault();
      await sendMessage($("messageInput").value);
    });

    $("messageInput").addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        $("chatForm").requestSubmit();
      }
    });

    function resizeInput() {
      const input = $("messageInput");
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 180) + "px";
    }

    $("messageInput").addEventListener("input", resizeInput);

    document.querySelectorAll("[data-prompt]").forEach(button => {
      button.addEventListener("click", () => {
        $("messageInput").value = button.dataset.prompt;
        resizeInput();
        $("messageInput").focus();
      });
    });

    $("newChatButton").addEventListener("click", () => {
      currentChatId = createChatId();
      $("messages").replaceChildren();
      $("messages").hidden = true;
      $("welcome").hidden = false;
      randomGreeting();
      $("messageInput").value = "";
      resizeInput();
      $("messageInput").focus();
    });

    $("signOutButton").addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Aster sign-out error:", error);
        toast("Couldn't sign out. Please try again.");
      }
    });

    $("accountButton").addEventListener("click", () => {
      const user = auth.currentUser;
      if (user) {
        toast(user.displayName || user.email || "Signed in");
      }
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".mode-wrap")) {
        $("modeDropdown").hidden = true;
        $("reasoningDropdown").hidden = true;
        $("modeButton").setAttribute("aria-expanded", "false");
        $("reasoningButton").setAttribute("aria-expanded", "false");
      }
    });

    onAuthStateChanged(auth, user => {
      $("app").hidden = !user;
      $("authScreen").hidden = Boolean(user);

      if (user) {
        $("accountButton").textContent =
          user.displayName || user.email || "Account";

        setStatus("online", "Connected");
        randomGreeting();
      } else {
        $("accountButton").textContent = "Signed out";
        $("messages").replaceChildren();
        $("messages").hidden = true;
        $("welcome").hidden = false;
        setStatus("", "Signed out");
      }
    }, error => {
      console.error("Aster auth-state error:", error);
      setAuthStatus(
        "Could not verify your session. Refresh the page and try again."
      );
    });

    // Lightweight connectivity check for the UI.
    fetch("/api/health")
      .then(response => {
        if (response.ok && !auth.currentUser) {
          setStatus("online", "API available");
        }
      })
      .catch(() => {
        // The chat endpoint will show a useful error if unavailable.
      });

    updateModeUI();
    randomGreeting();
  </script>
</body>
</html>
