<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05060c">
<title>Aster</title>
<!-- Page icon (Aster Logo) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23080a12'/><text x='16' y='24' font-size='22' text-anchor='middle' fill='%23c4b5fd' font-family='sans-serif'>✳</text></svg>">
<style>
:root {
  color-scheme: dark;
  --bg: #05060c;
  --panel: #0c0e19;
  --surface: #111321;
  --hover: #1b1d30;
  --border: #292c43;
  --text: #e7e6ef;
  --muted: #9293a8;
  --purple: #c4b5fd;
  --silver: #dedee9;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; width: 100%; height: 100%; }
body {
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% -15%, #211638 0%, transparent 55%),
    radial-gradient(ellipse at 90% 100%, #10172b 0%, transparent 50%),
    var(--bg);
  background-attachment: fixed;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
}
button, input, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { opacity: .55; cursor: wait; }
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--purple);
  outline-offset: 3px;
}
.app { display: flex; width: 100%; height: 100dvh; }
.sidebar {
  width: 250px; min-width: 250px; padding: 12px 9px;
  background: #080a12; border-right: 1px solid #191a2a;
  display: flex; flex-direction: column; gap: 9px;
  transition: width .25s ease, min-width .25s ease, padding .25s ease, border-color .25s ease;
  z-index: 30;
  overflow: hidden;
  white-space: nowrap;
}
/* When collapsed, sidebar smoothly enters inside completely (no mini strip) */
.sidebar.collapsed {
  width: 0 !important;
  min-width: 0 !important;
  padding: 0 !important;
  border-right: 0 !important;
  visibility: hidden;
  pointer-events: none;
}
.brand {
  height: 44px; display: flex; align-items: center;
  gap: 10px; padding: 0 8px; font-size: 19px;
}
.brand-mark {
  color: var(--purple); font-size: 27px;
  text-shadow: 0 0 20px #a78bfa88;
}
.brand-name { color: var(--silver); }
.icon-button, .new-chat, .recent-item {
  border: 0; background: transparent; border-radius: 10px;
}
.icon-button {
  width: 38px; height: 38px; flex-shrink: 0;
  display: inline-grid; place-items: center;
  color: var(--muted); font-size: 20px;
}
.icon-button:hover, .new-chat:hover, .recent-item:hover {
  background: var(--hover); color: var(--text);
}
.sidebar-top {
  display: flex; align-items: center; justify-content: space-between;
}
.new-chat {
  display: flex; align-items: center; gap: 10px;
  padding: 11px; text-align: left; white-space: nowrap;
}
.sidebar-label {
  padding: 20px 10px 5px; color: var(--muted); font-size: 12px;
}
.recent-list { flex: 1; min-height: 0; overflow-y: auto; }
.recent-item {
  display: block; width: 100%; padding: 10px;
  text-align: left; overflow: hidden; white-space: nowrap;
  text-overflow: ellipsis; font-size: 13px;
}
.recent-item.active { background: var(--hover); }
.recent-empty { padding: 10px; color: var(--muted); font-size: 12px; }
.sidebar-bottom {
  border-top: 1px solid #202135; padding-top: 9px;
  display: flex; align-items: center; gap: 8px;
}

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 62px; flex-shrink: 0; padding: 0 16px;
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 12px;
}
.topbar-left { display: flex; align-items: center; gap: 9px; }

/* Aster logo button in topbar - shows when sidebar collapses */
.topbar-brand {
  display: none;
  align-items: center;
  gap: 9px;
  background: transparent;
  border: 0;
  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
  color: var(--text);
  transition: background .2s, opacity .2s;
  animation: fadeIn .25s ease;
}
.topbar-brand:hover { background: var(--hover); }
.topbar-brand .topbar-brand-icon {
  color: var(--muted);
  font-size: 18px;
}
.topbar-brand .brand-mark {
  color: var(--purple);
  font-size: 24px;
  line-height: 1;
  text-shadow: 0 0 16px #a78bfa88;
}
.topbar-brand .brand-name {
  color: var(--silver);
  font-size: 17px;
  font-weight: 500;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}

.mode-wrap { position: relative; }
.mode-button {
  min-height: 39px; max-width: 230px; padding: 0 13px;
  border: 1px solid var(--border); border-radius: 22px;
  background: #111321; color: var(--silver);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dropdown-menu {
  display: none; position: absolute; z-index: 60;
  top: calc(100% + 9px); left: 0; width: 245px;
  padding: 7px; border: 1px solid var(--border);
  border-radius: 15px; background: #111321;
  box-shadow: 0 15px 45px #000b;
}
.dropdown-menu.open { display: block; }
.menu-heading {
  padding: 8px 10px; color: var(--muted);
  text-transform: uppercase; font-size: 10px; letter-spacing: .6px;
}
.menu-option {
  width: 100%; padding: 10px; border: 0;
  border-radius: 10px; display: flex;
  justify-content: space-between; gap: 10px;
  background: transparent; text-align: left; font-size: 13px;
}
.menu-option:hover { background: var(--hover); }
.menu-option.selected { background: #29213f; color: #e6dcff; }
.option-description {
  display: block; margin-top: 4px;
  color: var(--muted); font-size: 11px; line-height: 1.4;
}
.option-check { color: var(--purple); }
.switch {
  display: flex; gap: 3px; padding: 4px;
  border: 1px solid var(--border); border-radius: 30px;
  background: #10121f;
}
.switch-btn {
  min-width: 75px; padding: 8px 17px;
  border: 0; border-radius: 25px;
  background: transparent; color: var(--muted);
}
.switch-btn.active { background: #27293b; color: var(--silver); }
.status {
  justify-self: end; display: flex; align-items: center;
  gap: 7px; color: var(--muted); font-size: 11px;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
.status-dot.online { background: #81c995; box-shadow: 0 0 8px #81c99588; }
.status-dot.busy { background: #e6c27a; }
.status-dot.error { background: #ff8a80; }
.conversation { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
.welcome {
  width: min(720px, calc(100% - 32px)); min-height: 100%;
  margin: auto; padding: 0 0 8vh;
  display: flex; flex-direction: column; justify-content: center;
}
.greeting {
  margin: 0 0 13px; text-align: center;
  font-size: clamp(27px, 4vw, 39px); font-weight: 500;
  letter-spacing: -1px; line-height: 1.25;
  background: linear-gradient(100deg, #a78bfa, #e8e6f2, #c4b5fd, #a78bfa);
  background-size: 200% auto; color: transparent;
  background-clip: text; -webkit-background-clip: text;
  animation: sheen 8s linear infinite;
  filter: drop-shadow(0 0 20px #a78bfa33);
}
@keyframes sheen { to { background-position: 200% center; } }
.subtitle {
  margin: 0 0 18px; text-align: center;
  color: var(--muted); font-size: 14px; line-height: 1.7;
}
.suggestions {
  display: flex; justify-content: center;
  flex-wrap: wrap; gap: 9px; margin-top: 18px;
}
.suggestion {
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 25px; background: #10121e;
  color: var(--text); font-size: 12px;
}
.suggestion:hover { background: var(--hover); }
.suggestion span { color: var(--purple); margin-right: 5px; }

.messages {
  width: min(720px, calc(100% - 32px)); margin: auto;
  padding: 24px 0 30px; display: flex;
  flex-direction: column; gap: 25px;
}
.message { display: flex; min-width: 0; flex-direction: column; gap: 8px; }
.message.user { align-items: flex-end; }
.user-bubble {
  max-width: 90%; padding: 12px 16px;
  border: 1px solid #292c46; border-radius: 19px 19px 5px 19px;
  background: #191b2b; white-space: pre-wrap;
  overflow-wrap: anywhere; font-size: 15px; line-height: 1.7;
}
.message-role {
  display: flex; align-items: center; gap: 8px;
  color: #b4b3c5; font-size: 12px; font-weight: 600;
}
.role-mark { color: var(--purple); font-size: 18px; }
.role-mark.glowing { animation: glow 1.1s ease-in-out infinite; }
@keyframes glow {
  50% { text-shadow: 0 0 14px #c4b5fd, 0 0 35px #a78bfa; }
}
.message-body { font-size: 15px; line-height: 1.8; overflow-wrap: anywhere; }
.message-body p { margin: 0 0 13px; }
.message-body h1, .message-body h2, .message-body h3 { line-height: 1.4; }
.message-body pre {
  padding: 14px; max-width: 100%; overflow: auto;
  background: #090b13; border: 1px solid var(--border); border-radius: 12px;
}
.message-body code {
  padding: 2px 5px; border-radius: 5px;
  background: #202237; font-family: Consolas, monospace; font-size: .9em;
}
.message-body pre code { background: transparent; padding: 0; }
.message-body a { color: var(--purple); }
.message-body blockquote {
  border-left: 3px solid var(--purple); padding-left: 12px;
  color: #b8b8c8; margin-left: 0;
}
.message-body table { border-collapse: collapse; width: 100%; font-size: 13px; }
.message-body th, .message-body td {
  padding: 8px; text-align: left; border-bottom: 1px solid var(--border);
}
.message-body th { background: #191b2b; }
.table-wrap { overflow-x: auto; }
.message-actions { display: flex; gap: 6px; }
.small-action {
  padding: 5px 8px; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted); font-size: 11px;
}
.small-action:hover { background: var(--hover); }
.message-error { color: #ffb4ab; }
.typing { display: flex; gap: 5px; padding: 8px 0; }
.typing span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--purple); animation: pulse 1s infinite;
}
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes pulse {
  30% { opacity: 1; transform: translateY(-4px); }
  0%, 60%, 100% { opacity: .3; transform: none; }
}
.bottom-area { flex-shrink: 0; padding: 8px 18px 12px; }
.bottom-inner { width: min(720px, 100%); margin: auto; }
.composer-slot { width: 100%; }
.composer {
  display: flex; align-items: center; gap: 4px;
  width: 100%; min-height: 57px; padding: 7px;
  border: 1px solid #30334d; border-radius: 30px;
  background: #0c0e19;
  transition: box-shadow .2s, border-color .2s;
}
.composer:focus-within {
  border-color: #b5a0ff;
  box-shadow: 0 0 0 1px #b5a0ff33, 0 0 26px #a78bfa24;
}
.plus-button, .send-button {
  width: 36px; height: 36px; min-width: 36px;
  display: grid; place-items: center; border: 0; border-radius: 50%;
}
.plus-button { background: transparent; color: var(--silver); font-size: 21px; }
.composer textarea {
  flex: 1; min-width: 0; min-height: 36px; max-height: 160px;
  resize: none; padding: 8px 5px; border: 0; outline: none;
  background: transparent; color: var(--text); line-height: 1.5;
}
.composer textarea:focus-visible { outline: none; }
.composer textarea::placeholder { color: #77798d; }
.dropdown-button, .search-pill {
  min-height: 36px; padding: 0 10px; flex-shrink: 0;
  border: 1px solid transparent; border-radius: 20px;
  background: transparent; color: #d0cfdd; font-size: 12px;
  white-space: nowrap;
}
.dropdown-button:hover, .search-pill:hover { background: var(--hover); }
.search-pill { display: flex; align-items: center; gap: 6px; }
.search-pill.active {
  border-color: #8b7bd8; background: #241d3d;
  color: #e4d7ff; box-shadow: 0 0 15px #a78bfa22;
}
.search-pill svg { width: 19px; height: 19px; stroke: var(--purple); fill: none; }
.send-button {
  margin-left: 2px; background: linear-gradient(135deg, #e4d7ff, #b7a4ff);
  color: #15101f; font-size: 21px;
}
.send-button:disabled { background: #282938; color: #777; }
.disclaimer { margin-top: 9px; color: #707187; text-align: center; font-size: 10px; }
.toast {
  display: none; position: fixed; z-index: 150;
  left: 50%; bottom: 90px; transform: translateX(-50%);
  max-width: calc(100% - 30px); padding: 11px 15px;
  background: #191c2e; border: 1px solid var(--border);
  border-radius: 12px; box-shadow: 0 5px 20px #0008; font-size: 13px;
}
.toast.visible { display: block; }
.sheet-backdrop {
  display: none; position: fixed; inset: 0; z-index: 49;
  background: #010208a8; backdrop-filter: blur(3px);
}
.sheet-backdrop.visible { display: block; }
.think-wrap .dropdown-menu {
  position: fixed; left: 50%; top: auto; bottom: 18px;
  width: min(500px, calc(100vw - 24px)); transform: translateX(-50%);
  z-index: 50; border-radius: 20px;
}
.think-wrap .menu-option { padding: 13px; }
.auth-screen {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  overflow-y: auto; padding: 22px;
  background: radial-gradient(ellipse at 50% 0%, #21183b, transparent 55%), #05060c;
}
.auth-card {
  width: min(430px, 100%); padding: 32px 28px 25px;
  border: 1px solid #30304c; border-radius: 23px;
  background: #0c0e19f5; box-shadow: 0 24px 90px #0009;
}
.auth-brand { text-align: center; margin-bottom: 25px; }
.auth-brand .spark { color: var(--purple); font-size: 39px; }
.auth-brand h1 { margin: 8px 0; font-size: 26px; font-weight: 600; }
.auth-brand p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
.auth-field { display: block; margin: 15px 0; }
.auth-field span { display: block; margin-bottom: 7px; font-size: 12px; color: #c9c8d8; }
.auth-field input {
  width: 100%; padding: 13px 12px; border-radius: 11px;
  border: 1px solid #30334b; background: #090b14; color: var(--text);
}
.auth-primary, .auth-google {
  width: 100%; min-height: 45px; border-radius: 12px; font-size: 13px;
}
.auth-primary {
  margin-top: 7px; border: 0; color: #171021;
  background: linear-gradient(120deg, #e1d5ff, #b9a4ff);
  font-weight: 650;
}
.auth-google {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-top: 12px; background: #151724; border: 1px solid #35374e;
}
.auth-google .g { color: #e7e7ee; font-size: 17px; font-weight: 700; }
.auth-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 17px 0; color: #77798e; font-size: 11px;
}
.auth-divider::before, .auth-divider::after { content: ""; height: 1px; flex: 1; background: #292b40; }
.auth-links {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-top: 16px; flex-wrap: wrap;
}
.auth-link { border: 0; background: transparent; color: #c9baff; font-size: 12px; }
.auth-status { min-height: 18px; margin-top: 13px; color: #ffb4ab; font-size: 12px; line-height: 1.5; }
.auth-status.success { color: #a6e3b5; }
.auth-account { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 760px) {
  .sidebar {
    position: fixed; inset: 0 auto 0 0; height: 100dvh;
    width: 270px; min-width: 270px;
    transform: translateX(-105%); transition: transform .25s ease;
  }
  .sidebar.mobile-open { transform: translateX(0); box-shadow: 15px 0 50px #000a; }
  .sidebar.collapsed { width: 270px !important; min-width: 270px !important; visibility: visible; }
  .mobile-overlay.visible { display: block; position: fixed; inset: 0; background: #0009; z-index: 29; }
  .topbar { height: 55px; display: flex; padding: 0 8px; gap: 5px; }
  .topbar-left { flex: 1; min-width: 0; }
  .topbar-brand { display: inline-flex !important; }
  .mode-button { max-width: 155px; padding: 0 8px; font-size: 12px; }
  .switch-btn { min-width: 54px; padding: 7px 10px; font-size: 12px; }
  .status span:last-child { display: none; }
  .welcome { width: calc(100% - 26px); padding-bottom: 5vh; }
  .greeting { font-size: clamp(25px, 7vw, 32px); }
  .subtitle { font-size: 13px; }
  .messages { width: calc(100% - 28px); padding-top: 18px; }
  .bottom-area { padding: 7px 8px 10px; }
  .composer { gap: 2px; padding: 5px 4px; }
  .composer textarea { font-size: 14px; padding: 7px 3px; }
  .dropdown-button { padding: 0 7px; font-size: 11px; }
  #thinkingLabel, .think-wrap .chevron { display: none; }
  .search-pill { width: 35px; min-width: 35px; justify-content: center; padding: 0; }
  .search-pill-text { display: none; }
  .plus-button, .send-button { width: 33px; height: 33px; min-width: 33px; }
  .think-wrap .dropdown-menu {
    left: 0; right: 0; bottom: 0; width: 100%;
    transform: none; border-radius: 22px 22px 0 0;
    padding: 13px 14px calc(18px + env(safe-area-inset-bottom));
  }
  .think-wrap .menu-option { padding: 16px 12px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <section class="auth-card">
    <div class="auth-brand">
      <div class="spark">✳</div>
      <h1 id="authTitle">Welcome back</h1>
      <p id="authSubtitle">Sign in to continue to your personal workspace.</p>
    </div>

    <form id="authForm">
      <label class="auth-field" id="authNameWrap" hidden>
        <span>Your name</span>
        <input id="authName" type="text" autocomplete="name" maxlength="80" placeholder="Your name">
      </label>
      <label class="auth-field">
        <span>Email address</span>
        <input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com">
      </label>
      <label class="auth-field">
        <span>Password</span>
        <input id="authPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters">
      </label>
      <button class="auth-primary" id="authSubmitButton" type="submit">Sign in with email</button>
    </form>

    <div class="auth-divider">OR</div>
    <button class="auth-google" id="googleAuthButton" type="button">
      <span class="g">G</span><span id="googleButtonText">Continue with Google</span>
    </button>

    <div class="auth-links">
      <button class="auth-link" id="switchAuthButton" type="button">Create an account</button>
      <button class="auth-link" id="forgotPasswordButton" type="button">Forgot password?</button>
    </div>
    <div class="auth-status" id="authStatus" role="status" aria-live="polite"></div>
  </section>
</div>

<div class="mobile-overlay" id="mobileOverlay"></div>

<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-mark">✳</span>
        <span class="brand-name">Aster</span>
      </div>
      <button class="icon-button" id="sidebarToggle" type="button" title="Close sidebar" aria-label="Close sidebar">☰</button>
    </div>
    <button class="new-chat" id="newChat" type="button">
      <span>＋</span><span>New chat</span>
    </button>
    <div class="sidebar-label">Recent conversations</div>
    <div class="recent-list" id="recentList"></div>
    <div class="sidebar-bottom">
      <button class="icon-button" id="connectionButton" type="button" title="Check connection">↻</button>
      <div style="min-width:0;flex:1">
        <div class="auth-account" id="accountEmail"></div>
        <button class="auth-link" id="signOutButton" type="button">Sign out</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <!-- Aster logo toggle button: shows when sidebar is collapsed -->
        <button class="topbar-brand" id="topbarBrand" type="button" title="Open sidebar" aria-label="Open sidebar">
          <span class="topbar-brand-icon">☰</span>
          <span class="brand-mark">✳</span>
          <span class="brand-name">Aster</span>
        </button>

        <div class="mode-wrap">
          <button class="mode-button" id="modeButton" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="modeLabel">Dew Standard</span> ▾
          </button>
          <div class="dropdown-menu" id="modeMenu" role="menu">
            <div class="menu-heading">Choose a Dew mode</div>
            <button class="menu-option selected" data-mode="Standard" role="menuitemradio" aria-checked="true" type="button">
              <span><strong>Dew Standard</strong><span class="option-description">Everyday work, writing and coding</span></span><span class="option-check">✓</span>
            </button>
            <button class="menu-option" data-mode="Extended" role="menuitemradio" aria-checked="false" type="button">
              <span><strong>Dew Extended</strong><span class="option-description">More involved tasks</span></span><span class="option-check"></span>
            </button>
            <button class="menu-option" data-mode="Search" role="menuitemradio" aria-checked="false" type="button">
              <span><strong>Dew Search</strong><span class="option-description">Search-oriented answers from the web</span></span><span class="option-check"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="switch" role="tablist" aria-label="Chat or Code">
        <button class="switch-btn active" data-tab="Chat" role="tab" aria-selected="true" type="button">Chat</button>
        <button class="switch-btn" data-tab="Code" role="tab" aria-selected="false" type="button">⌘ Code</button>

const API_URL = "/api/chat";

// Safe local storage persistence for chats
function getStorageKey() {
  const uid = window.asterCurrentUser?.uid;
  return uid ? "aster_chats_" + uid : "aster_chats_guest";
}

function loadPersistedChats() {
  try {
    const raw = localStorage.getItem(getStorageKey());
    chats = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(chats)) chats = [];
  } catch (err) {
    console.warn("Could not load chats from storage:", err);
    chats = [];
  }
}

function persistChats() {
  try {
    localStorage.setItem(getStorageKey(), JSON.stringify(chats));
  } catch (err) {
    console.warn("Could not save chats to storage:", err);
  }
}

$("thinkingButton").addEventListener("click", event => {

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function inlineMarkdown(value) {
  let text = escapeHTML(value);
  const code = [];
  text = text.replace(/`([^`\n]+)`/g, (_, content) => {
    const token = "%%CODE" + code.length + "%%";
    code.push("<code>" + content + "</code>");
    return token;
  });
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    (_, label, url) => '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + "</a>");
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  text = text.replace(/~~(.+?)~~/g, "<del>$1</del>");
  code.forEach((item, index) => {
    text = text.replace("%%CODE" + index + "%%", item);
  });
  return text;
}

function renderMarkdown(markdown) {
  const lines = String(markdown).replace(/\r\n?/g, "\n").split("\n");
  const output = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    if (/^\s*```/.test(line)) {
      i++;
      const code = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      if (i < lines.length) i++;
      output.push("<pre><code>" + escapeHTML(code.join("\n")) + "</code></pre>");
      continue;
    }

    const heading = line.match(/^\s*(#{1,3})\s+(.+)$/);
    if (heading) {
      const level = heading[1].length;
      output.push("<h" + level + ">" + inlineMarkdown(heading[2]) + "</h" + level + ">");
      i++;
      continue;
    }

    if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
      output.push("<hr>"); i++; continue;
    }

    if (/^\s*>\s?/.test(line)) {
      const quote = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        quote.push(lines[i++].replace(/^\s*>\s?/, ""));
      }
      output.push("<blockquote>" + quote.map(inlineMarkdown).join("<br>") + "</blockquote>");
      continue;
    }

    if (/^\s*([-*+])\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line)) {
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const tag = ordered ? "ol" : "ul";
      const pattern = ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/;
      const items = [];
      while (i < lines.length && pattern.test(lines[i])) {
        items.push("<li>" + inlineMarkdown(lines[i++].replace(pattern, "")) + "</li>");
      }
      output.push("<" + tag + ">" + items.join("") + "</" + tag + ">");
      continue;
    }

    const paragraph = [];
    while (i < lines.length && lines[i].trim() &&
      !/^\s*```/.test(lines[i]) &&
      !/^\s*#{1,3}\s+/.test(lines[i]) &&
      !/^\s*(---+|\*\*\*+|___+)\s*$/.test(lines[i]) &&
      !/^\s*>\s?/.test(lines[i]) &&
      !/^\s*([-*+])\s+/.test(lines[i]) &&
      !/^\s*\d+[.)]\s+/.test(lines[i])) {
      paragraph.push(lines[i++]);
    }
    output.push("<p>" + paragraph.map(inlineMarkdown).join("<br>") + "</p>");
  }
  return output.join("\n");
}

function getCurrentChat() {
  return chats.find(chat => String(chat.id) === String(currentChatId)) || null;
}
function ensureChat() {
  let chat = getCurrentChat();
  if (chat) return chat;
  chat = {
    id: "chat_" + Date.now() + "_" + Math.floor(Math.random() * 10000),
    title: "New conversation",
    messages: []
  };
  chats.unshift(chat);
  currentChatId = chat.id;
  persistChats();
  return chat;
}
function refreshRecentList() {
  const list = $("recentList");
  list.replaceChildren();

  if (!chats.length) {
    const empty = document.createElement("div");
    empty.className = "recent-empty";
    empty.textContent = "Your recent chats will appear here.";
    list.appendChild(empty);
    return;
  }

  chats.forEach(chat => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "recent-item" + (String(chat.id) === String(currentChatId) ? " active" : "");
    button.textContent = chat.title;
    button.title = chat.title;
    button.addEventListener("click", () => {
      if (isSending) return showToast("Wait for Dew to finish first.");
      currentChatId = chat.id;
      renderHistory(chat);
      refreshRecentList();
      closeMobileSidebar();
    });
    list.appendChild(button);
  });
}
function saveMessage(role, text) {
  const chat = ensureChat();
  chat.messages.push({ role, text });
  if (role === "user" && chat.messages.length === 1) {
    chat.title = text.replace(/\s+/g, " ").slice(0, 42) || "New conversation";
  }
  persistChats();
  refreshRecentList();
  return chat.messages.length - 1;
}
function renderHistory(chat) {
  messages.replaceChildren();
  chat.messages.forEach((item, index) => renderMessage(item.role, item.text, false, index));
  welcome.hidden = true;
  messages.hidden = false;
  moveComposerToBottom();
  conversation.scrollTop = conversation.scrollHeight;
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast("Copied.");
  } catch {
    showToast("Clipboard access was blocked by the browser.");
  }
}
function renderMessage(role, text, save = true, historyIndex = -1) {
  const index = save ? saveMessage(role, text) : historyIndex;
  const wrapper = document.createElement("article");
  wrapper.className = "message " + (role === "user" ? "user" : "assistant");

  if (role === "user") {
    const bubble = document.createElement("div");
    bubble.className = "user-bubble";
    bubble.textContent = text;
    wrapper.appendChild(bubble);
  } else {
    const label = document.createElement("div");
    label.className = "message-role";
    const mark = document.createElement("span");
    mark.className = "role-mark";
    mark.textContent = "✳";
    const name = document.createElement("span");
    name.textContent = "Dew";
    label.append(mark, name);
    const body = document.createElement("div");
    body.className = "message-body";
    body.innerHTML = renderMarkdown(text);
    wrapper.append(label, body);
  }

  const actions = document.createElement("div");
  actions.className = "message-actions";
  const copy = document.createElement("button");
  copy.type = "button";
  copy.className = "small-action";
  copy.textContent = "Copy";
  copy.addEventListener("click", () => copyText(text));
  actions.appendChild(copy);

  if (role === "user") {
    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "small-action";
    edit.textContent = "Edit";
    edit.addEventListener("click", () => editMessage(index));
    actions.appendChild(edit);
  }

  wrapper.appendChild(actions);
  messages.appendChild(wrapper);
  conversation.scrollTop = conversation.scrollHeight;
  return wrapper;
}
function editMessage(index) {
  if (isSending) return showToast("Wait for Dew to finish first.");
  const chat = getCurrentChat();
  if (!chat || !chat.messages[index] || chat.messages[index].role !== "user") return;
  input.value = chat.messages[index].text;
  chat.messages.splice(index);
  persistChats();
  renderHistory(chat);
  resizeInput();
  input.focus();
}
function addTyping() {
  const node = document.createElement("article");
  node.className = "message assistant";
  node.id = "typingIndicator";
  node.innerHTML = '<div class="message-role"><span class="role-mark glowing">✳</span><span>Dew is thinking</span></div><div class="typing"><span></span><span></span><span></span></div>';
  messages.appendChild(node);
  conversation.scrollTop = conversation.scrollHeight;
}

async function getDewReply(message) {
  const user = window.asterCurrentUser;
  if (!user || typeof user.getIdToken !== "function") {
    throw new Error("Please sign in again to continue.");
  }

  let token;
  try {
    token = await user.getIdToken();
  } catch (error) {
    console.error("Firebase token error:", error);
    throw new Error("Your sign-in session could not be verified. Please sign in again.");
  }

  const payload = {
    message,
    mode: "Dew " + selectedMode,
    reasoning: selectedReasoning,
    searchEnabled: selectedMode === "Search",
    conversationId: currentChatId
  };

  let response;
  try {
    response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify(payload)
    });
  } catch (error) {
    console.error("Dew network error:", error);
    throw new Error("Aster could not reach its API. Check your connection and deployment.");
  }

  const raw = await response.text();
  let data;
  try {
    data = JSON.parse(raw);
  } catch {
    console.error("Non-JSON API response:", response.status, raw.slice(0, 300));
    if (response.status === 404) {
      throw new Error("The /api/chat endpoint was not found. Check your Vercel deployment.");
    }
    throw new Error("The API returned an invalid response (HTTP " + response.status + ").");
  }

  if (!response.ok) {
    const detail = data.error || data.detail || data.message;
    console.error("Dew API error:", response.status, data);
    throw new Error(typeof detail === "string" ? detail : "API request failed (HTTP " + response.status + ").");
  }

  if (typeof data.answer !== "string" || !data.answer.trim()) {
    throw new Error("The API responded without an answer. Check api/chat.js.");
  }
  return {
    answer: data.answer,
    sources: Array.isArray(data.sources) ? data.sources : []
  };
}

function appendSources(answer, sources) {
  const valid = sources.filter(source =>
    source && typeof source.title === "string" &&
    typeof source.url === "string" && /^https?:\/\//i.test(source.url)
  );
  if (!valid.length) return answer;
  const unique = [...new Map(valid.map(source => [source.url, source])).values()];
  return answer + "\n\n**Sources**\n" + unique.map(source =>
    "- [" + source.title.replace(/[\[\]]/g, "") + "](" + source.url + ")"
  ).join("\n");
}

async function processQueue() {
  if (isSending || messageQueue.length === 0) return;
  const nextMessage = messageQueue.shift();

  isSending = true;
  addTyping();
  setStatus("busy", "Dew is responding");

  try {
    const result = await getDewReply(nextMessage);
    $("typingIndicator")?.remove();
    renderMessage("assistant", appendSources(result.answer, result.sources));
    setStatus("online", "API reachable");
  } catch (error) {
    $("typingIndicator")?.remove();
    console.error("Dew request failed:", error);
    const errorNode = renderMessage(
      "assistant",
      "I couldn't complete that request.\n\n" +
      (error instanceof Error ? error.message : "An unexpected error occurred."),
      false
    );
    errorNode.querySelector(".message-body")?.classList.add("message-error");
    setStatus("error", "Request failed");
  } finally {
    isSending = false;
    if (messageQueue.length > 0) {
      processQueue();
    } else {
      setStatus("online", "API reachable");
    }
  }
}

async function sendMessage(rawMessage) {
  const message = rawMessage.trim();
  if (!message) return showToast("Enter a message first.");
  if (message.length > 1200) return showToast("Messages must be 1,200 characters or fewer.");

  closeDropdowns();
  welcome.hidden = true;
  messages.hidden = false;
  moveComposerToBottom();

  // Render user message on screen immediately and clear input so chat bar stays free
  renderMessage("user", message);
  input.value = "";
  resizeInput();
  input.focus();

  messageQueue.push(message);
  processQueue();
}

composer.addEventListener("submit", event => {
  event.preventDefault();
  sendMessage(input.value);
});
input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    composer.requestSubmit();
  }
});
function resizeInput() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}
input.addEventListener("input", resizeInput);

document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click", () => {
    input.value = button.dataset.prompt;
    resizeInput();
    composer.requestSubmit();
  });
});
$("newChat").addEventListener("click", () => {
  if (isSending || messageQueue.length > 0) return showToast("Wait for Dew to finish before starting a new chat.");
  currentChatId = null;
  messages.replaceChildren();
  messages.hidden = true;
  welcome.hidden = false;
  moveComposerToWelcome();
  input.value = "";
  resizeInput();
  setGreeting();
  closeDropdowns();
  closeMobileSidebar();
  refreshRecentList();
  conversation.scrollTop = 0;
  input.focus();
});

async function checkConnection(showResult = false) {
  setStatus("", "Checking connection");
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);

  try {
    const response = await fetch(HEALTH_URL, {
      signal: controller.signal,
      cache: "no-store"
    });
    if (!response.ok) throw new Error("Health endpoint returned HTTP " + response.status);
    const data = await response.json();
    if (data.status !== "ok") throw new Error("Unexpected health-check response");
    setStatus("online", "API reachable");
    if (showResult) showToast("Aster API is reachable.");
  } catch (error) {
    console.warn("Aster health check failed:", error);
    setStatus("error", "API unavailable");
    if (showResult) showToast("Health check failed. Check /api/health on your deployment.");
  } finally {
    clearTimeout(timer);
  }
}
$("connectionButton").addEventListener("click", () => checkConnection(true));

function setAuthStatus(message, success = false) {
  $("authStatus").textContent = message;
  $("authStatus").classList.toggle("success", success);
}
function setAuthMode(mode) {
  const signup = mode === "signup";
  $("authTitle").textContent = signup ? "Create your account" : "Welcome back";
  $("authSubtitle").textContent = signup
    ? "Create an account to start using your Aster workspace."
    : "Sign in to continue to your personal workspace.";
  $("authNameWrap").hidden = !signup;
  $("authName").required = signup;
  $("authPassword").autocomplete = signup ? "new-password" : "current-password";
  $("authSubmitButton").textContent = signup ? "Create account" : "Sign in with email";
  $("googleButtonText").textContent = signup ? "Sign up with Google" : "Continue with Google";
  $("switchAuthButton").textContent = signup ? "Already have an account? Sign in" : "Create an account";
  $("forgotPasswordButton").hidden = signup;
  $("authForm").dataset.mode = mode;
  setAuthStatus("");
}
function setAuthBusy(busy) {
  ["authSubmitButton", "googleAuthButton", "switchAuthButton", "forgotPasswordButton"].forEach(id => {
    $(id).disabled = busy;
  });
}
function friendlyAuthError(error) {
  const messages = {
    "auth/invalid-email": "That email address doesn't look valid.",
    "auth/missing-password": "Enter your password to continue.",
    "auth/weak-password": "Choose a password with at least 6 characters.",
    "auth/email-already-in-use": "An account already uses that email. Try signing in.",
    "auth/invalid-credential": "The email or password is incorrect.",
    "auth/user-not-found": "No account was found. Create an account first.",
    "auth/wrong-password": "The email or password is incorrect.",
    "auth/popup-closed-by-user": "The Google sign-in window was closed.",
    "auth/popup-blocked": "Your browser blocked the Google sign-in window. Allow pop-ups and try again.",
    "auth/unauthorized-domain": "This domain is not authorized in Firebase Authentication.",
    "auth/network-request-failed": "Network error. Check your connection and try again.",
    "auth/too-many-requests": "Too many attempts. Wait a little before trying again.",
    "auth/operation-not-allowed": "This sign-in method is not enabled in Firebase."
  };
  return messages[error?.code] || "Authentication failed. Check your details and try again.";
}
function showAuthenticated(user) {
  window.asterCurrentUser = user || null;
  const signedIn = Boolean(user);
  app.hidden = !signedIn;
  authScreen.hidden = signedIn;
  document.body.classList.toggle("authenticated", signedIn);

  if (user) {
    $("accountEmail").textContent = user.displayName || user.email || "Signed in";
    setStatus("", "Checking connection");
    checkConnection();

    // Load persisted chats for this account
    loadPersistedChats();
    refreshRecentList();
    if (chats.length > 0) {
      currentChatId = chats[0].id;
      renderHistory(chats[0]);
    } else {
      currentChatId = null;
      messages.replaceChildren();
      messages.hidden = true;
      welcome.hidden = false;
      moveComposerToWelcome();
    }
  } else {
    setAuthMode("login");
    chats = [];
    currentChatId = null;
    refreshRecentList();
  }
}

$("switchAuthButton").addEventListener("click", () => {
  const current = $("authForm").dataset.mode || "login";
  setAuthMode(current === "signup" ? "login" : "signup");
});

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!authInstance || !authInitialized) {
    setAuthStatus("Authentication is still starting. Try again in a moment.");
    return;
  }

  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;
  const signup = $("authForm").dataset.mode === "signup";

  if (!email || !password) return setAuthStatus("Enter your email and password.");
  if (signup && password.length < 6) return setAuthStatus("Choose a password with at least 6 characters.");

  setAuthBusy(true);
  setAuthStatus("");
  try {
    if (signup) {
      const credential = await createUserWithEmailAndPassword(authInstance, email, password);
      const name = $("authName").value.trim();
      if (name) await updateProfile(credential.user, { displayName: name });
    } else {
      await signInWithEmailAndPassword(authInstance, email, password);
    }
  } catch (error) {
    console.error("Email sign-in error:", error);
    setAuthStatus(friendlyAuthError(error));
  } finally {
    setAuthBusy(false);
  }
});

$("googleAuthButton").addEventListener("click", async () => {
  if (!authInstance || !authInitialized) {
    return setAuthStatus("Authentication is still starting. Try again in a moment.");
  }
  setAuthBusy(true);
  setAuthStatus("");
  try {
    await signInWithPopup(authInstance, googleProviderInstance);
  } catch (error) {
    console.error("Google sign-in error:", error);
    setAuthStatus(friendlyAuthError(error));
  } finally {
    setAuthBusy(false);
  }
});

$("forgotPasswordButton").addEventListener("click", async () => {
  const email = $("authEmail").value.trim();
  if (!email) {
    setAuthStatus("Enter your email address first.");
    $("authEmail").focus();
    return;
  }
  if (!authInstance) return setAuthStatus("Firebase is not ready yet.");

  setAuthBusy(true);
  try {
    await sendPasswordResetEmail(authInstance, email);
    setAuthStatus("If an account exists for that email, a reset message has been sent.", true);
  } catch (error) {
    console.error("Password reset error:", error);
    setAuthStatus(friendlyAuthError(error));
  } finally {
    setAuthBusy(false);
  }
});

$("signOutButton").addEventListener("click", async () => {
  if (!authInstance) return;
  try {
    await signOut(authInstance);
  } catch (error) {
    console.error("Sign-out error:", error);
    showToast("Couldn't sign out. Please try again.");
  }
});

function initApp() {
  loadPersistedChats();
  moveComposerToWelcome();
  setGreeting();
  syncSearchButton();
  refreshRecentList();
  updateSidebarBrandState();
  input.placeholder = "Ask Dew anything";
}

initApp();
</script>

<script type="module">
import { auth, googleProvider } from "/firebase.js";
import {
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  updateProfile,
  sendPasswordResetEmail,
  signInWithPopup,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

try {
  window.asterFirebaseReady = true;
  window.asterCurrentUser = null;

  window.asterAuthActions = {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    updateProfile,
    sendPasswordResetEmail,
    signInWithPopup,
    signOut
  };

  window.asterFirebaseAuth = auth;
  window.asterGoogleProvider = googleProvider;

  onAuthStateChanged(auth, user => {
    window.asterCurrentUser = user || null;
    window.asterAuthInitialized = true;

    showAuthenticated(user);
  }, error => {
    console.error("Firebase auth state error:", error);
    document.getElementById("authStatus").textContent =
      "Could not verify your session. Refresh the page and try again.";
  });
} catch (error) {
  console.error("Firebase initialization error:", error);
  document.getElementById("authStatus").textContent =
    "Firebase could not start. Check your /firebase.js configuration.";
}
</script>

<script>
const authBridgeTimer = setInterval(() => {
  if (!window.asterFirebaseReady || !window.asterFirebaseAuth || !window.asterAuthActions) return;
  clearInterval(authBridgeTimer);

  const actions = window.asterAuthActions;
  window.authInstance = window.asterFirebaseAuth;

  authInstance = window.asterFirebaseAuth;
  googleProviderInstance = window.asterGoogleProvider;

  window.signInWithEmailAndPassword = actions.signInWithEmailAndPassword;
  window.createUserWithEmailAndPassword = actions.createUserWithEmailAndPassword;
  window.updateProfile = actions.updateProfile;
  window.sendPasswordResetEmail = actions.sendPasswordResetEmail;
  window.signInWithPopup = actions.signInWithPopup;
  window.signOut = actions.signOut;

  signInWithEmailAndPassword = actions.signInWithEmailAndPassword;
  createUserWithEmailAndPassword = actions.createUserWithEmailAndPassword;
  updateProfile = actions.updateProfile;
  sendPasswordResetEmail = actions.sendPasswordResetEmail;
  signInWithPopup = actions.signInWithPopup;
  signOut = actions.signOut;

  authInitialized = true;
}, 50);
setTimeout(() => {
  if (!authInitialized) {
    $("authStatus").textContent =
      "Firebase is taking too long to start. Check /firebase.js and refresh.";
  }
}, 8000);
</script>
