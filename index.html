
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#131314">
  <meta name="description" content="Dew is an AI assistant for thinking, learning, research, and coding.">
  <title>Dew — AI Assistant</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #131314;
      --panel: #1e1f20;
      --hover: #2b2c2e;
      --text: #e3e3e3;
      --muted: #a1a1aa;
      --accent: #c4b5fd;
      --border: #38393b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
    }

    /* SIDEBAR */

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: #191a1b;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .2s ease, padding .2s ease;
    }

    .sidebar.collapsed {
      width: 76px;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 28px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-button:hover {
      background: var(--hover);
    }

    .sparkle {
      color: var(--accent);
      font-size: 29px;
      line-height: 1;
      filter: drop-shadow(0 0 9px #a78bfa44);
    }

    .new-chat {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border: 0;
      border-radius: 24px;
      padding: 13px 16px;
      background: #28292b;
      text-align: left;
      white-space: nowrap;
    }

    .new-chat:hover,
    .side-link:hover {
      background: #343537;
    }

    .side-link {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 24px;
      border: 0;
      background: transparent;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      flex-shrink: 0;
    }

    .side-symbol {
      width: 20px;
      text-align: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .sidebar.collapsed .side-label,
    .sidebar.collapsed .new-label {
      display: none;
    }

    .sidebar.collapsed .new-chat {
      justify-content: center;
      padding: 13px 0;
    }

    .sidebar.collapsed .side-link {
      justify-content: center;
      padding: 12px 0;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    /* MAIN WORKSPACE */

    .main {
      flex: 1;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 72px;
      min-height: 72px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #35313f;
      border: 1px solid #5d526e;
      color: #e5d9ff;
      flex-shrink: 0;
    }

    /* CONVERSATION LAYOUT */

    .conversation {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 28px 20px;
      display: flex;
      flex-direction: column;
    }

    /* Landing screen: greeting, composer, then suggestions. */

    .conversation.landing {
      justify-content: center;
    }

    .welcome {
      flex: 0 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 0 30px;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: -1.8px;
      line-height: 1.2;
      background: linear-gradient(
        100deg,
        #d9caff,
        #e9e7f0,
        #a8c7fa
      );
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }

    /* CHAT MESSAGES */

    .messages {
      display: none;
      flex-direction: column;
      gap: 24px;
      padding: 20px 0 30px;
    }

    .messages.active {
      display: flex;
    }

    .message {
      max-width: 85%;
      line-height: 1.7;
      font-size: 15px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #303134;
      padding: 14px 18px;
      border-radius: 22px 22px 5px 22px;
    }

    .message.assistant {
      align-self: flex-start;
      width: 100%;
      padding: 8px 0;
    }

    .message.assistant.error {
      color: #d9b6b6;
    }

    /* SUGGESTED PROMPTS */

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 24px auto 0;
      width: 100%;
      max-width: 680px;
    }

    .suggestion {
      min-height: 88px;
      padding: 16px;
      border-radius: 17px;
      background: var(--panel);
      border: 1px solid transparent;
      text-align: left;
      color: #dedee2;
      transition: background .15s, border-color .15s;
    }

    .suggestion:hover {
      background: #28292b;
      border-color: #444549;
    }

    .suggestion small {
      display: block;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.4;
    }

    /* COMPOSER */

    .composer-area {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .composer {
      background: var(--panel);
      border: 1px solid #3a3b3d;
      border-radius: 28px;
      padding: 17px 17px 12px;
      transition: border-color .2s, box-shadow .2s;
    }

    .composer:focus-within {
      border-color: #686477;
      box-shadow: 0 0 0 1px #c4b5fd10;
    }

    .composer textarea {
      display: block;
      width: 100%;
      min-height: 45px;
      max-height: 180px;
      resize: none;
      outline: none;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      padding: 2px 3px 10px;
    }

    .composer textarea::placeholder {
      color: #a3a3aa;
    }

    .composer-controls {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    /* DROPDOWNS */

    .dropdown {
      position: relative;
    }

    .dropdown-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 22px;
      background: transparent;
      padding: 8px 12px;
      font-size: 13px;
      white-space: nowrap;
    }

    .dropdown-trigger:hover,
    .dropdown-trigger[aria-expanded="true"] {
      background: #303134;
      border-color: #414247;
    }

    .dew-mark {
      color: var(--accent);
      font-size: 17px;
    }

    .chevron {
      color: #aaaab2;
      font-size: 12px;
    }

    .dropdown-menu {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 0;
      min-width: 205px;
      padding: 6px;
      background: #292a2d;
      border: 1px solid #44454a;
      border-radius: 16px;
      box-shadow: 0 12px 40px #0007;
      display: none;
      z-index: 20;
    }

    .dropdown-menu.open {
      display: block;
      animation: appear .12s ease-out;
    }

    .menu-heading {
      padding: 10px 11px 7px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .menu-option {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: transparent;
      text-align: left;
      font-size: 13px;
    }

    .menu-option:hover,
    .menu-option.selected {
      background: #3a3b3f;
    }

    .check {
      color: var(--accent);
    }

    .reasoning-menu {
      min-width: 170px;
    }

    .spacer {
      flex: 1;
    }

    .send-button {
      height: 39px;
      width: 39px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #e5e1f5;
      color: #24212e;
      font-size: 22px;
      font-weight: 600;
      transition: opacity .2s, transform .2s;
    }

    .send-button:hover {
      transform: scale(1.04);
    }

    .send-button:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none;
    }

    .disclaimer {
      padding: 13px 8px 0;
      color: #888990;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    /* ACTIVE CHAT: messages scroll above the bottom composer. */

    .conversation.chatting {
      justify-content: flex-start;
    }

    .conversation.chatting .welcome,
    .conversation.chatting .suggestions {
      display: none;
    }

    .conversation.chatting .messages {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #444549 transparent;
    }

    .conversation.chatting .composer-area {
      margin-top: auto;
      padding-top: 12px;
      padding-bottom: 4px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* RESPONSIVE */

    @media (max-width: 720px) {
      .sidebar {
        position: fixed;
        z-index: 50;
        inset: 0 auto 0 0;
        width: 260px;
        min-height: 100vh;
        min-height: 100dvh;
        box-shadow: 12px 0 40px #0005;
      }

      .sidebar.collapsed {
        width: 0;
        padding: 0;
        overflow: hidden;
        border: 0;
      }

      .topbar {
        height: 62px;
        min-height: 62px;
        padding: 0 14px;
      }

      .conversation {
        padding: 12px 15px 14px;
      }

      .conversation.landing {
        justify-content: center;
      }

      .welcome {
        padding-bottom: 26px;
      }

      .welcome h1 {
        letter-spacing: -1.2px;
      }

      .suggestions {
        gap: 8px;
        margin-top: 20px;
      }

      .suggestion {
        min-height: 80px;
        padding: 12px;
        font-size: 13px;
      }

      .composer {
        padding: 14px 12px 10px;
      }

      .composer-controls {
        gap: 4px;
      }

      .dropdown-trigger {
        gap: 6px;
        padding: 8px 9px;
        font-size: 12px;
      }

      .message {
        max-width: 94%;
      }
    }

    @media (max-width: 390px) {
      .suggestions {
        grid-template-columns: 1fr;
      }

      .suggestion {
        min-height: 65px;
      }

      .dropdown-trigger {
        padding: 7px;
      }

      .composer-controls {
        gap: 2px;
      }

      .dew-mark {
        font-size: 15px;
      }
    }

    @media (max-height: 650px) and (min-width: 721px) {
      .conversation {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .welcome {
        padding-bottom: 16px;
      }

      .suggestions {
        margin-top: 16px;
      }

      .suggestion {
        min-height: 72px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button
          class="icon-button"
          id="closeSidebar"
          aria-label="Collapse sidebar"
          title="Collapse sidebar"
          type="button"
        >
          <span class="sparkle">✳</span>
        </button>
      </div>

      <button class="new-chat" id="newChat" type="button">
        <span class="side-symbol">＋</span>
        <span class="new-label">New chat</span>
      </button>

      <button class="side-link" id="recentButton" type="button">
        <span class="side-symbol">◷</span>
        <span class="side-label">Recent chats</span>
      </button>

      <button class="side-link" id="clearButton" type="button">
        <span class="side-symbol">⌫</span>
        <span class="side-label">Clear conversation</span>
      </button>

      <div class="sidebar-bottom">
        <div class="side-link">
          <span class="side-symbol">✧</span>
          <span class="side-label">Dew AI</span>
        </div>
      </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button
            class="icon-button"
            id="openSidebar"
            aria-label="Toggle sidebar"
            title="Toggle sidebar"
            type="button"
          >
            <span style="font-size:22px">☰</span>
          </button>

          <!-- Sparkle only. No visible Aster text label. -->
          <span class="sparkle" aria-label="Aster" title="Aster">✳</span>
        </div>

        <div class="profile" aria-label="Profile">M</div>
      </header>

      <!--
        IMPORTANT ORDER:
        1. Greeting
        2. Messages
        3. Composer
        4. Suggestions

        Messages are hidden on the landing screen.
        During a conversation, suggestions and greeting are hidden,
        leaving messages above the composer.
      -->
      <section class="conversation landing" id="conversation">

        <div class="welcome" id="welcome">
          <h1 id="greeting">What are we thinking today?</h1>
        </div>

        <div
          class="messages"
          id="messages"
          aria-live="polite"
          aria-relevant="additions text"
        ></div>

        <!-- CHAT COMPOSER -->
        <div class="composer-area">
          <form class="composer" id="chatForm">
            <textarea
              id="prompt"
              rows="1"
              placeholder="Ask Dew anything..."
              aria-label="Message Dew"
            ></textarea>

            <div class="composer-controls">

              <!-- DROPDOWN 1: DEW MODE -->
              <div class="dropdown" id="dewDropdown">
                <button
                  class="dropdown-trigger"
                  type="button"
                  id="dewTrigger"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  <span class="dew-mark">✳</span>
                  <span id="dewLabel">Dew Standard</span>
                  <span class="chevron">▾</span>
                </button>

                <div
                  class="dropdown-menu"
                  id="dewMenu"
                  role="menu"
                  aria-label="Choose Dew mode"
                >
                  <div class="menu-heading">Choose Dew mode</div>

                  <button
                    class="menu-option selected"
                    type="button"
                    role="menuitemradio"
                    aria-checked="true"
                    data-mode="Standard"
                  >
                    <span>Dew Standard</span>
                    <span class="check">✓</span>
                  </button>

                  <button
                    class="menu-option"
                    type="button"
                    role="menuitemradio"
                    aria-checked="false"
                    data-mode="Search"
                  >
                    <span>Dew Search</span>
                    <span class="check"></span>
                  </button>

                  <button
                    class="menu-option"
                    type="button"
                    role="menuitemradio"
                    aria-checked="false"
                    data-mode="Extended"
                  >
                    <span>Dew Extended</span>
                    <span class="check"></span>
                  </button>
                </div>
              </div>

              <!-- DROPDOWN 2: REASONING -->
              <div class="dropdown" id="reasoningDropdown">
                <button
                  class="dropdown-trigger"
                  type="button"
                  id="reasoningTrigger"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  <span id="reasoningLabel">Medium</span>
                  <span class="chevron">▾</span>
                </button>

                <div
                  class="dropdown-menu reasoning-menu"
                  id="reasoningMenu"
                  role="menu"
                  aria-label="Choose reasoning level"
                >
                  <div class="menu-heading">Reasoning level</div>

                  <button
                    class="menu-option"
                    type="button"
                    role="menuitemradio"
                    aria-checked="false"
                    data-level="Low"
                  >
                    <span>Low</span>
                    <span class="check"></span>
                  </button>

                  <button
                    class="menu-option selected"
                    type="button"
                    role="menuitemradio"
                    aria-checked="true"
                    data-level="Medium"
                  >
                    <span>Medium</span>
                    <span class="check">✓</span>
                  </button>

                  <button
                    class="menu-option"
                    type="button"
                    role="menuitemradio"
                    aria-checked="false"
                    data-level="High"
                  >
                    <span>High</span>
                    <span class="check"></span>
                  </button>
                </div>
              </div>

              <div class="spacer"></div>

              <button
                class="send-button"
                id="sendButton"
                type="submit"
                aria-label="Send message"
                title="Send message"
                disabled
              >↑</button>
            </div>
          </form>

          <div class="disclaimer">
            Dew can make mistakes. Check important information.
          </div>
        </div>

        <!-- SUGGESTIONS APPEAR UNDER THE COMPOSER ON THE LANDING SCREEN -->
        <div class="suggestions" id="suggestions">
          <button
            class="suggestion"
            type="button"
            data-prompt="Help me develop an idea into a clear plan."
          >
            <span>✧ Develop an idea</span>
            <small>Turn a rough thought into a practical plan.</small>
          </button>

          <button
            class="suggestion"
            type="button"
            data-prompt="Explain a difficult topic clearly, step by step."
          >
            <span>▤ Learn something</span>
            <small>Break down a complex topic.</small>
          </button>

          <button
            class="suggestion"
            type="button"
            data-prompt="Help me write and improve some code."
          >
            <span>⌘ Write some code</span>
            <small>Work through programming problems.</small>
          </button>

          <button
            class="suggestion"
            type="button"
            data-prompt="Help me research a topic and identify useful sources."
          >
            <span>⌕ Research a topic</span>
            <small>Explore information and useful sources.</small>
          </button>
        </div>

      </section>
    </main>
  </div>

  <script>
    /* ELEMENTS */

    const sidebar = document.getElementById("sidebar");
    const conversation = document.getElementById("conversation");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("sendButton");
    const chatForm = document.getElementById("chatForm");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const suggestions = document.getElementById("suggestions");
    const greeting = document.getElementById("greeting");

    let selectedMode = "Standard";
    let selectedReasoning = "Medium";
    let busy = false;

    /* RANDOM GREETINGS */

    const captions = [
      "What are we thinking today?",
      "Let's make something useful.",
      "A new idea starts here.",
      "What can we figure out?",
      "Ready when you are.",
      "Let's get to work.",
      "Big ideas start somewhere.",
      "What shall we explore today?",
      "Curiosity looks good on you.",
      "Bring your next idea to life.",
      "What are we building today?",
      "Let's solve something interesting.",
      "Start with a question.",
      "Your next idea starts here.",
      "What would you like to understand?",
      "Think it through with Dew.",
      "Let's make sense of it.",
      "One question can start anything."
    ];

    function setRandomGreeting() {
      const previousCaption = greeting.textContent;
      let nextCaption = previousCaption;

      if (captions.length > 1) {
        while (nextCaption === previousCaption) {
          nextCaption = captions[
            Math.floor(Math.random() * captions.length)
          ];
        }
      }

      greeting.textContent = nextCaption;
    }

    // A different caption on every page load, not based on the time.
    setRandomGreeting();

    /* SIDEBAR */

    document.getElementById("closeSidebar").addEventListener("click", () => {
      if (window.matchMedia("(max-width: 720px)").matches) {
        sidebar.classList.add("collapsed");
      } else {
        sidebar.classList.toggle("collapsed");
      }
    });

    document.getElementById("openSidebar").addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
    });

    // Keep the sidebar out of the way on small screens.
    function setInitialSidebarState() {
      if (window.matchMedia("(max-width: 720px)").matches) {
        sidebar.classList.add("collapsed");
      } else {
        sidebar.classList.remove("collapsed");
      }
    }

    setInitialSidebarState();

    let previousMobileState =
      window.matchMedia("(max-width: 720px)").matches;

    window.addEventListener("resize", () => {
      const currentMobileState =
        window.matchMedia("(max-width: 720px)").matches;

      if (currentMobileState !== previousMobileState) {
        setInitialSidebarState();
        previousMobileState = currentMobileState;
      }
    });

    /* NEW CHAT AND CLEAR CONVERSATION */

    function newChat() {
      messages.replaceChildren();
      messages.classList.remove("active");

      conversation.classList.remove("chatting");
      conversation.classList.add("landing");

      welcome.style.display = "";
      suggestions.style.display = "";

      promptInput.value = "";
      promptInput.style.height = "auto";

      setRandomGreeting();
      closeDropdowns();
      updateSendButton();

      promptInput.focus();
    }

    document.getElementById("newChat").addEventListener("click", newChat);
    document.getElementById("clearButton").addEventListener("click", newChat);

    document.getElementById("recentButton").addEventListener("click", () => {
      alert(
        "Chat history will appear here when conversation storage is connected."
      );
    });

    /* DROPDOWNS */

    const dropdowns = [
      {
        trigger: document.getElementById("dewTrigger"),
        menu: document.getElementById("dewMenu")
      },
      {
        trigger: document.getElementById("reasoningTrigger"),
        menu: document.getElementById("reasoningMenu")
      }
    ];

    function closeDropdowns(except = null) {
      dropdowns.forEach(dropdown => {
        if (dropdown !== except) {
          dropdown.menu.classList.remove("open");
          dropdown.trigger.setAttribute("aria-expanded", "false");
        }
      });
    }

    dropdowns.forEach(dropdown => {
      dropdown.trigger.addEventListener("click", event => {
        event.stopPropagation();

        const willOpen = !dropdown.menu.classList.contains("open");

        closeDropdowns(dropdown);

        dropdown.menu.classList.toggle("open", willOpen);
        dropdown.trigger.setAttribute(
          "aria-expanded",
          String(willOpen)
        );
      });
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".dropdown")) {
        closeDropdowns();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeDropdowns();
      }
    });

    function updateRadioOptions(menu, attribute, value) {
      menu.querySelectorAll(`[data-${attribute}]`).forEach(option => {
        const selected = option.dataset[attribute] === value;

        option.classList.toggle("selected", selected);
        option.setAttribute("aria-checked", String(selected));

        const check = option.querySelector(".check");

        if (check) {
          check.textContent = selected ? "✓" : "";
        }
      });
    }

    /* DEW MODE SELECTION */

    document.querySelectorAll("[data-mode]").forEach(option => {
      option.addEventListener("click", () => {
        selectedMode = option.dataset.mode;

        document.getElementById("dewLabel").textContent =
          `Dew ${selectedMode}`;

        updateRadioOptions(
          document.getElementById("dewMenu"),
          "mode",
          selectedMode
        );

        closeDropdowns();
      });
    });

    /* REASONING SELECTION */

    document.querySelectorAll("[data-level]").forEach(option => {
      option.addEventListener("click", () => {
        selectedReasoning = option.dataset.level;

        document.getElementById("reasoningLabel").textContent =
          selectedReasoning;

        updateRadioOptions(
          document.getElementById("reasoningMenu"),
          "level",
          selectedReasoning
        );

        closeDropdowns();
      });
    });

    /* COMPOSER */

    function updateSendButton() {
      sendButton.disabled = busy || !promptInput.value.trim();
    }

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";

      promptInput.style.height =
        Math.min(promptInput.scrollHeight, 180) + "px";

      updateSendButton();
    });

    promptInput.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    /* SUGGESTION CARDS */

    document.querySelectorAll("[data-prompt]").forEach(button => {
      button.addEventListener("click", () => {
        promptInput.value = button.dataset.prompt;

        promptInput.dispatchEvent(new Event("input"));
        promptInput.focus();
      });
    });

    /* MESSAGE RENDERING */

    function scrollMessagesToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = `message ${type}`;
      message.textContent = text;

      messages.appendChild(message);
      scrollMessagesToBottom();

      return message;
    }

    /* BACKEND INTEGRATION */

    /*
      Add your deployed Dew API endpoint below.

      Expected request:
      {
        "message": "Hello",
        "mode": "Standard",
        "reasoning": "Medium"
      }

      Expected response:
      {
        "reply": "Hello! How can I help?"
      }

      Do not place private API keys in browser-side JavaScript.
    */

    const DEW_API_URL = "";

    async function getDewReply(message) {
      if (!DEW_API_URL) {
        throw new Error(
          "Dew's backend is not connected yet. Configure DEW_API_URL in index.html."
        );
      }

      const response = await fetch(DEW_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message,
          mode: selectedMode,
          reasoning: selectedReasoning
        })
      });

      if (!response.ok) {
        throw new Error(`Dew API returned HTTP ${response.status}.`);
      }

      const data = await response.json();

      if (typeof data.reply !== "string") {
        throw new Error("The Dew API did not return a reply.");
      }

      return data.reply;
    }

    /* SEND A MESSAGE */

    chatForm.addEventListener("submit", async event => {
      event.preventDefault();

      const text = promptInput.value.trim();

      if (!text || busy) {
        return;
      }

      // Switch from landing layout to chat layout.
      // CSS now places messages above the bottom composer.
      conversation.classList.remove("landing");
      conversation.classList.add("chatting");

      welcome.style.display = "none";
      suggestions.style.display = "none";
      messages.classList.add("active");

      addMessage(text, "user");

      promptInput.value = "";
      promptInput.style.height = "auto";

      busy = true;
      updateSendButton();

      const loadingMessage = addMessage(
        "Dew is thinking...",
        "assistant"
      );

      try {
        const reply = await getDewReply(text);

        loadingMessage.textContent = reply;
      } catch (error) {
        loadingMessage.textContent = error.message;
        loadingMessage.classList.add("error");
      } finally {
        busy = false;
        updateSendButton();
        scrollMessagesToBottom();
        promptInput.focus();
      }
    });
  </script>
</body>
</html>
